# Lunar IMP Semantic Segmentation — NAC only
# Backbone: lunarmind_v1_base from 100k pretraining
# (matrix_base_vit_4g_8w_128b_1r_250s_6pf) — same checkpoint used for the
# NAC crater detection / segmentation configs.
#
# Task: dense per-pixel Impact-Melt-Pond / background classification.
# Masks come straight from the COCO polygons rasterised by
# LunarImpSegDataset (0 = background, 1 = IMP).
#
# RUN (from repo root):
#   PYTHONPATH=. \
#   terratorch fit --config terratorch_integration/configs/imp_segmentation_nac_graha.yaml
seed_everything: 42
custom_modules_path: terratorch_integration

trainer:
  accelerator: gpu
  devices: 1
  precision: "32"
  max_epochs: 100
  check_val_every_n_epoch: 1
  log_every_n_steps: 5
  logger:
    class_path: TensorBoardLogger
    init_args:
      save_dir: tb_logs/
      name: imp-segmentation-nac-graha
  callbacks:
    - class_path: LearningRateMonitor
      init_args:
        logging_interval: epoch
    - class_path: ModelCheckpoint
      init_args:
        dirpath: tb_logs/checkpoints/imp-segmentation-nac-graha
        monitor: val/loss
        mode: min
        filename: best-{epoch:02d}-{val/loss:.3f}
        save_top_k: 1
        save_last: false

data:
  class_path: terratorch.datamodules.GenericNonGeoSegmentationDataModule
  init_args:
    batch_size: 4
    num_workers: 1
    rgb_indices:
      - 0
      - 0
      - 0
    # Data roots are defined as dicts with modalities as keys
    train_data_root: /nobackupnfs1/sroy14/processed_data/Lunar/data_release/IMP_dataset/train
    train_label_data_root: /nobackupnfs1/sroy14/processed_data/Lunar/data_release/IMP_dataset/train
    val_data_root: /nobackupnfs1/sroy14/processed_data/Lunar/data_release/IMP_dataset/val
    val_label_data_root: /nobackupnfs1/sroy14/processed_data/Lunar/data_release/IMP_dataset/val
    test_data_root: /nobackupnfs1/sroy14/processed_data/Lunar/data_release/IMP_dataset/test
    test_label_data_root: /nobackupnfs1/sroy14/processed_data/Lunar/data_release/IMP_dataset/test
    predict_data_root:  /nobackupnfs1/sroy14/processed_data/Lunar/data_release/IMP_dataset/test
    train_split: /nobackupnfs1/sroy14/processed_data/Lunar/data_release/IMP_dataset/train_0_1.txt
    val_split: /nobackupnfs1/sroy14/processed_data/Lunar/data_release/IMP_dataset/val.txt
    test_split: /nobackupnfs1/sroy14/processed_data/Lunar/data_release/IMP_dataset/test.txt
    num_classes: 2
    ignore_split_file_extensions: false
    img_grep: "*_img.tif"
    label_grep: "*_mask.tif"
    no_label_replace: -1
    no_data_replace: 0
    # Define standardization values as dicts
    means:
      - 0.030510
    stds:
      - 0.017363
    # Transforms are shared between all image modalities (e.g. same crop area)
    train_transform:
      - class_path: albumentations.D4
      - class_path: albumentations.RandomBrightnessContrast
        init_args:
          brightness_limit: 0.15
          contrast_limit: 0.15
          p: 0.5
      - class_path: albumentations.pytorch.transforms.ToTensorV2


model:
  class_path: terratorch_integration.LunarSegmentationTask
  init_args:
    backbone_lr: 5.0e-5
    head_lr: 2.0e-4
    layer_decay: 0.75
    weight_decay: 0.05
    warmup_steps: 200
    eta_min: 1.0e-6
    model_factory: EncoderDecoderFactory
    model_args:
      backbone: lunarmind_v1_base
      backbone_checkpoint_path: /nobackupnfs1/sroy14/gabby/Lunar-FM/experiments/lunarfm_base_dual_full_nas_no_nans_256_256_lr1e-4_wd0.05/checkpoints/checkpoint_weights_final.pt
      backbone_cfg: /nobackupnfs1/sroy14/gabby/Lunar-FM/experiments/lunarfm_base_dual_full_nas_no_nans_256_256_lr1e-4_wd0.05/full_config.yaml
      backbone_modality_info_path: /nobackupnfs1/sroy14/gabby/Lunar-FM/experiments/lunarfm_base_dual_full_nas_no_nans_256_256_lr1e-4_wd0.05/modality_info.yaml
      # ============================================================
      # NEW MODALITY:
      # ============================================================
      # The checkpoint was trained on vis, dtm, slope, aspect, etc.
      # but NOT on nac_custom. We're adding it here dynamically.
      backbone_patch_size: 8
      backbone_remove_register_tokens: false  # Remove 4 register tokens before neck
      backbone_modalities:
        - nac
      # Register tokens are auto-detected from checkpoint
      # This checkpoint has num_register_tokens=0, so no register tokens
      # If checkpoint had register tokens, they would be auto-detected
      # backbone_remove_register_tokens: true  # Remove register tokens before neck (if any)
      # backbone_merge_method: concat     
      # Neck configuration for tiny model (12 encoder layers)
      necks:
        - name: SelectIndices
          indices: [2, 5, 8, 11]  # Select 4 layers from 12-layer encoder
        # - name: LearnedTokenProjection
        #   output_dim: 768
        - name: ReshapeTokensToImage
          remove_cls_token: false
          h: 32  # sqrt(1024) for 256x256 / 8x8 patches
        - name: LearnedInterpolateToPyramidal
      decoder: UNetDecoder
      decoder_channels: [512, 256, 128, 64]    
      head_channel_list: [256]
      head_dropout: 0.1
      num_classes: 2
    # Composite loss: Dice + weighted CE. Dice gives the region-shape signal,
    # CE gives per-pixel gradient (stronger away from the target than Dice's
    # 1-D signal), and class_weights on CE up-weights the rare IMP class to
    # attack the precision gap seen against ConvNeXt.
    loss:
      dice: 1.0
      ce: 0.5
    class_weights: [1.0, 5.0]
    aux_loss:
      aux_head: 1.0
    freeze_backbone: false
    freeze_decoder: false
    ignore_index: -1
    plot_on_val: 10