# Lunar Crater Detection — WAC 5-band multi-spectral + metadata
# Backbone: lunarmind_v1_base pretrained on WAC vis + metadata (no-nans 256 run)
#
# Checkpoint facts (derived from weights):
#   embed_dim=768, encoder_depth=12, patch_size=16
#   vis.pos_emb=(1, 256, 768) → 256 spatial tokens per 256×256 image
#   num_register_tokens=0, in_domains=[vis, metadata, nac, dtm_3m, ...]
#
# RUN:
#   PYTHONPATH=. \
#   terratorch fit --config terratorch_integration/configs/crater_detection_wac_vis_meta.yaml
#
# To train vis-only (no metadata), comment out the metadata lines below and
# set backbone_modalities to [vis] only.
seed_everything: 42
custom_modules_path: terratorch_integration

trainer:
  accelerator: gpu
  devices: 1
  precision: "32"
  max_epochs: 100
  check_val_every_n_epoch: 1
  log_every_n_steps: 10
  enable_checkpointing: true
  logger:
    class_path: TensorBoardLogger
    init_args:
      save_dir: tb_logs/wac-crater
      name: crater-detection-wac-vis-ps8-full-inc60-80-ml-sfp-dp01v2
  callbacks:
    - class_path: LearningRateMonitor
      init_args:
        logging_interval: epoch
    - class_path: ModelCheckpoint
      init_args:
        dirpath: tb_logs/checkpoints/crater-detection-wac-vis-ps8-full-inc60-80-ml-sfp-dp01v2
        monitor: val_map
        mode: max
        filename: best-{epoch:02d}-{val_map:.3f}
        save_last: true
    - class_path: EarlyStopping
      init_args:
        monitor: val_map
        mode: max
        patience: 15

data:
  class_path: terratorch_integration.data_adapter.LunarWACCraterDataModule
  init_args:
    data_dir: data/coco_annotations_WAC_test_10k
    annotations_dir: data/coco_annotations_WAC_test_10k/inc60-80_spatial/inc60-80_spatial
    # metadata_file: data/coco_annotations_WAC_test_10k/inc60-80_spatial/inc60-80_spatial/wac_robbins_inc60-80_1k_spatial_split.parquet
    # tokenizer/binning default to bundled files; override here if needed:
    # metadata_tokenizer_path: terramind/utils/tokenizer/trained/text_tokenizer_terramind_wordpiece_30k_binned_xyxy_reindexed.json
    # metadata_binning_config_path: terramind/utils/tokenizer/trained/metadata_binning_config.csv
    batch_size: 4
    num_workers: 4
    image_size: 512              # matches pretraining input_size (256×256)
    min_diameter_px: 10.0
    drop_no_crater_images: true
    # Per-channel mean/std computed from the training split (8000 tiles)
    # using compute_training_stats() in robins_dev.ipynb:
    wac_norm_means: [0.019855351744561284, 0.02773482313902164, 0.029789978425941957, 0.03144318894931929, 0.03381151791456804]
    wac_norm_stds:  [0.009741310229443915, 0.01323344600455514, 0.01407650071036384, 0.014859192415839976, 0.016153428019436693]
    # train_fraction: 0.5
    # D4 group augmentation (0/90/180/270 rot + optional horizontal flip)
    # applied per-sample to image, vis, and boxes together. Val/test stay
    # identity so eval numbers remain directly comparable.
    train_transforms:
      class_path: terratorch_integration.data_utils.D4DetectionTransform
      init_args:
        image_keys: [image, vis]
        p: 1.0

model:
  class_path: terratorch_integration.LunarObjectDetectionTask
  init_args:
    model_factory: ObjectDetectionModelFactory
    model_args:
      framework: faster-rcnn
      backbone: lunarmind_v1_base
      backbone_checkpoint_path: weights/backbone/checkpoint_weights_final.pt
      backbone_cfg: weights/backbone/full_config.yaml
      backbone_modality_info_path: weights/modality_info.yaml

      num_classes: 2             # background + crater
      framework_min_size: 512
      framework_max_size: 512

      backbone_modalities:
        - vis                    # (B, 5, 256, 256) — 5-band WAC multi-spectral
        # - metadata               # (B, 10)          — tokenised observation metadata

      # Deliberate override, NOT the checkpoint's native patch size. The
      # pretrained vis.pos_emb is (1, 256, 768) = a 16x16 token grid at 256px,
      # i.e. native patch_size 16. Setting 8 yields a 32x32 grid (1024 tokens,
      # 4x the compute) to resolve small craters. FlexiViT PI-resize in the
      # 16 -> 8 direction is a least-squares projection and does NOT preserve
      # the pretrained response, so the encoder adapts during finetuning.
      backbone_patch_size: 8
      backbone_remove_register_tokens: false
      backbone_merge_method: concat

      # Stochastic depth on the encoder for fine-tuning only. Pretraining used
      # drop_path=0, so this regularizes the fine-tune specifically — attacks
      # FM-specific overfitting (val→test gap larger on FM than on smaller
      # backbones). Forwarded through LunarBackbone **kwargs to TerraMind.
      backbone_drop_path_rate_encoder: 0.1

      # vis produces 256 spatial tokens (16×16 grid at patch_size=16).
      # metadata appends 10 sequence tokens.
      # SelectIndices picks 4 equidistant layers from the 12-layer encoder.
      # ReshapeTokensToImage reconstructs the 16×16 spatial grid from the
      # vis token stream only (h=16, no CLS token).
      in_channels: 5             # vis has 5 spectral bands
      necks:
        - name: SelectIndices
          indices: [2, 5, 8, 11]
        - name: ReshapeTokensToImage
          remove_cls_token: false
          h: 64                  # 256 tokens = 16×16 spatial grid at patch_size=16
        - name: MultilayerSimpleFeaturePyramid
          out_channels: 256
        - name: FeaturePyramidNetworkNeck

    freeze_backbone: false
    freeze_decoder: false

    class_names:
      - Background
      - Crater

    # -------------------- Fair-reporting metric config --------------------
    # score_threshold: pre-metric filter in apply_nms_batch. Default 0.5
    # discards the true-positive tail on dense-detection tasks; drop to 0.05
    # so the mAP curve sees the low-confidence detections it is designed for.
    # iou_threshold: NMS IoU (default 0.5). Kept explicit for symmetry across
    # NAC/WAC/LRO — bump toward 0.7 if you see many overlapping duplicates.
    # metric_kwargs: forwarded to torchmetrics MeanAveragePrecision so we can
    # lift the default max_detection_thresholds=[1, 10, 100] ceiling on dense
    # GT (≈200–330 boxes / tile) and get per-class AP. Same list across NAC
    # and WAC keeps the datasets scored on the same ruler.
    score_threshold: 0.05
    iou_threshold: 0.5
    metric_kwargs:
      max_detection_thresholds: [100, 300, 500]
      class_metrics: true

    anchor_sizes: [[8], [16], [32], [64]]
    anchor_aspect_ratios: [0.5, 1.0, 2.0]

    # LLRD: pretrained backbone gets smaller LR than randomly-init'd heads.
    # dp01v2: dp01 + head_lr↓, head_wd↑, layer_decay↓. See NAC dp01v2 comment.
    #   head_lr: 1e-4 → 5e-5
    #   head_weight_decay: 1e-4 → 1e-3
    #   layer_decay: 0.75 → 0.65
    backbone_lr: 5.0e-5
    head_lr: 5.0e-5
    layer_decay: 0.65
    weight_decay: 0.05
    head_weight_decay: 1.0e-3
    betas: [0.9, 0.999]
    warmup_steps: 500
    eta_min: 1.0e-6

# NOTE: intentionally NO top-level optimizer / lr_scheduler blocks.
# Lightning CLI monkey-patches configure_optimizers when present, which
# would silently discard the LLRD param groups defined by the task.
