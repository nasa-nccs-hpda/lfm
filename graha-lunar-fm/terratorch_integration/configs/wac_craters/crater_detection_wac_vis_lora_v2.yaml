# Lunar Crater Detection — WAC 5-band vis, LoRA PEFT variant (fused-qkv path)
# Backbone: lunarmind_v1_base pretrained on WAC vis + metadata (no-nans 256 run)
#
# Based on crater_detection_wac_vis_ml_sfp_dp01v2.yaml. Difference:
# instead of full fine-tune + LLRD, the pretrained encoder is frozen and only
# LoRA adapters (fused-qkv path — no replace_qkv, single-GEMM fast path
# preserved) + detector heads / neck / new-modality embedders train.
#
# See crater_detection_nac_only_lora_v2.yaml for the rationale on skipping
# replace_qkv (v1 with replace_qkv ran ~3× slower than baseline; v2 keeps
# the fused-qkv Linear so LoRA A/B binds to (dim → 3·dim) and SDPA still
# hits its single-GEMM fast path).
#
# Requires: pip install terratorch[peft]
#
# RUN:
#   PYTHONPATH=. \
#   terratorch fit --config terratorch_integration/configs/wac_craters/crater_detection_wac_vis_lora_v2.yaml
seed_everything: 42
custom_modules_path: terratorch_integration

trainer:
  accelerator: gpu
  devices: 1
  precision: "32"
  max_epochs: 100
  check_val_every_n_epoch: 1
  log_every_n_steps: 10
  enable_checkpointing: true
  logger:
    class_path: TensorBoardLogger
    init_args:
      save_dir: tb_logs/wac-crater
      name: crater-detection-wac-vis-full-inc60-80-lora-v2
  callbacks:
    - class_path: LearningRateMonitor
      init_args:
        logging_interval: epoch
    - class_path: ModelCheckpoint
      init_args:
        dirpath: tb_logs/checkpoints/crater-detection-wac-vis-full-inc60-80-lora-v2
        monitor: val_map
        mode: max
        filename: best-{epoch:02d}-{val_map:.3f}
        save_last: true
    - class_path: EarlyStopping
      init_args:
        monitor: val_map
        mode: max
        patience: 15

data:
  class_path: terratorch_integration.data_adapter.LunarWACCraterDataModule
  init_args:
    data_dir: data/coco_annotations_WAC_test_10k
    annotations_dir: data/coco_annotations_WAC_test_10k/inc60-80_spatial/inc60-80_spatial
    batch_size: 4
    num_workers: 4
    image_size: 512
    min_diameter_px: 10.0
    drop_no_crater_images: true
    # Full training set. Set to 0.5 / 0.25 for data-efficiency ablations.
    train_fraction: 1.0
    wac_norm_means: [0.019855351744561284, 0.02773482313902164, 0.029789978425941957, 0.03144318894931929, 0.03381151791456804]
    wac_norm_stds:  [0.009741310229443915, 0.01323344600455514, 0.01407650071036384, 0.014859192415839976, 0.016153428019436693]
    train_transforms:
      class_path: terratorch_integration.data_utils.D4DetectionTransform
      init_args:
        image_keys: [image, vis]
        p: 1.0
    train_fraction: 1

model:
  class_path: terratorch_integration.LunarObjectDetectionTask
  init_args:
    model_factory: ObjectDetectionModelFactory
    model_args:
      framework: faster-rcnn
      backbone: lunarmind_v1_base
      backbone_checkpoint_path: weights/backbone/checkpoint_weights_final.pt
      backbone_cfg: weights/backbone/full_config.yaml
      backbone_modality_info_path: weights/modality_info.yaml

      num_classes: 2
      framework_min_size: 512
      framework_max_size: 512

      backbone_modalities:
        - vis

      backbone_patch_size: 8
      backbone_remove_register_tokens: false
      backbone_merge_method: concat

      backbone_drop_path_rate_encoder: 0.1

      in_channels: 5
      necks:
        - name: SelectIndices
          indices: [2, 5, 8, 11]
        - name: ReshapeTokensToImage
          remove_cls_token: false
          h: 64
        - name: MultilayerSimpleFeaturePyramid
          out_channels: 256
        - name: FeaturePyramidNetworkNeck

    freeze_backbone: false
    freeze_decoder: false

    class_names:
      - Background
      - Crater

    score_threshold: 0.05
    iou_threshold: 0.5
    metric_kwargs:
      max_detection_thresholds: [100, 300, 500]
      class_metrics: true

    anchor_sizes: [[8], [16], [32], [64]]
    anchor_aspect_ratios: [0.5, 1.0, 2.0]

    # -------------------- PEFT / LoRA (fused-qkv path) --------------------
    # No `replace_qkv`. target_modules names the fused qkv Linear directly,
    # so LoRA's A/B matrices bind to the (dim → 3·dim) projection. Attention
    # forward keeps the single-GEMM + SDPA fast path.
    # target_modules includes mlp.fc3: TerraMind uses SwiGLU (GatedMlp) with
    # fc1/fc2/fc3 — fc3 is the gate branch, previously missing.
    # exclude_modules skips TerraMind's decoder blocks entirely (LunarBackbone
    # only forward-calls the encoder; decoder adapters would receive no
    # gradient signal but still cost memory + step time).
    peft_config:
      method: LORA
      peft_config_kwargs:
        r: 16
        lora_alpha: 32
        lora_dropout: 0.05
        bias: none
        target_modules:
          - qkv
          - mlp.fc1
          - mlp.fc2
          - mlp.fc3
        exclude_modules: '.*decoder\..*'

    # LoRA replaces LLRD (base encoder frozen; no pretrained-block params to
    # decay). Flat LR, layer_decay: 1.0, no WD on adapters.
    backbone_lr: 1.0e-4
    head_lr: 1.0e-4
    layer_decay: 1.0
    weight_decay: 0.0
    head_weight_decay: 1.0e-3
    betas: [0.9, 0.999]
    warmup_steps: 500
    eta_min: 1.0e-6

# NOTE: intentionally NO top-level optimizer / lr_scheduler blocks.
# Lightning CLI monkey-patches configure_optimizers when present, which
# would silently discard the param groups defined by the task.
