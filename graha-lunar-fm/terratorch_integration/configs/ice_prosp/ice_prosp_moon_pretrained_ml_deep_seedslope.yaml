# Ice-prospectivity regression — moonfm (lunarmind_v1_base) backbone with the
# NASA-IMPACT "TUNEICE_gfft_repl511_ml_refdtm" recipe ported to the terratorch
# integration:
#
#   * Multilayer feature tap: SelectIndices [2, 5, 8, 11] -> one block per SFP scale.
#   * ViTDet Simple Feature Pyramid + torchvision FPN (all levels at 256 ch).
#   * SumFuseDeepGNDecoder: bilinearly upsample every FPN level to the finest,
#     sum, then a 4-stage GroupNorm+GELU 3x3 head (256 -> 256 -> 128 -> 128 -> 64).
#     The RegressionHead's 1x1 conv + bilinear-to-input handles the final 64 -> 1
#     projection and upsample to 256x256.
#   * base LR 3e-4 for fresh weights (decoder / head / new-modality embedders);
#     encoder top block at ~1.5e-4 (backbone_lr = 0.5 x head_lr), LLRD 0.75 below.
#   * warmup 10 epochs (~130 steps at 108 train samples / effective bs=8),
#     cosine to 1e-6, grad_clip 0.5, AdamW eps 1e-6.
#
# RUN:
#   bsub -q normal -n 10 -M 64G -gpu "num=1:mode=exclusive_process" \
#        -oo logs/%J.out -eo logs/%J.err \
#        PYTHONPATH=.:$PYTHONPATH \
#        terratorch fit -c terratorch_integration/configs/ice_prosp/ice_prosp_moon_pretrained_ml_deep.yaml

seed_everything: 42
custom_modules_path: terratorch_integration
out_dtype: float32

trainer:
  accelerator: gpu
  devices: 1
  precision: '32'
  max_epochs: 600
  check_val_every_n_epoch: 1
  log_every_n_steps: 2
  gradient_clip_val: 0.5
  gradient_clip_algorithm: norm
  accumulate_grad_batches: 2
  logger:
    class_path: TensorBoardLogger
    init_args:
      save_dir: tb_logs/ice_prosp/
      name: prosp-lunar-p8-ml-deep-seedslope-600ep
  callbacks:
    - class_path: LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: ModelCheckpoint
      init_args:
        dirpath: tb_logs/checkpoints/prosp-lunar-p8-ml-deep-seedslope-600ep
        monitor: val/RMSE
        mode: min
        filename: best-{epoch:02d}-{val\RMSE:.4f}
        save_top_k: 1
        save_last: false
  default_root_dir: tb_logs/

data:
  class_path: terratorch.datamodules.GenericMultiModalDataModule
  init_args:
    task: 'regression'
    batch_size: 4
    num_workers: 1
    modalities:
      - aspect
      - CUR
      - DICE
      - LPSR
      - LPSR_DEN
      - LPSR_DIS
      - slope
      - TMAX
    train_data_root: data/ice_prosp
    train_label_data_root: data/ice_prosp
    val_data_root: data/ice_prosp
    val_label_data_root: data/ice_prosp
    test_data_root: data/ice_prosp
    test_label_data_root: data/ice_prosp
    predict_data_root: data/ice_prosp
    train_split: data/ice_prosp/train_filtered.txt
    val_split: data/ice_prosp/val_filtered.txt
    test_split: data/ice_prosp/test_filtered.txt

    image_grep:
      aspect: "*_ASP_SIN_COS.tif"
      CUR: "*_CUR.tif"
      DICE: "*_DICE.tif"
      LPSR: "*_LPSR.tif"
      LPSR_DEN: "*_LPSR_DEN.tif"
      LPSR_DIS: "*_LPSR_DIS.tif"
      slope: "*_SLOPE.tif"
      TMAX: "*_TMAX.tif"
    label_grep: "*_PRO.tif"
    no_label_replace: -1
    no_data_replace: 0
    means:
      aspect:   [-0.003915, 0.009272]
      CUR:      [0]
      DICE:     [0.429733]
      LPSR:     [0.062075]
      LPSR_DEN: [0.062062]
      LPSR_DIS: [2115.858434]
      slope:    [8.464441]
      TMAX:     [228.021751]
    stds:
      aspect:   [0.668003, 0.669717]
      CUR:      [0.000280]
      DICE:     [0.454594]
      LPSR:     [0.241292]
      LPSR_DEN: [0.195937]
      LPSR_DIS: [2115.858434]
      slope:    [6.172140]
      TMAX:     [47.689147]
    train_transform:
      - class_path: albumentations.D4
      - class_path: albumentations.pytorch.transforms.ToTensorV2

model:
  class_path: terratorch_integration.LunarPixelwiseRegressionTask
  init_args:
    model_factory: EncoderDecoderFactory
    model_args:
      backbone: lunarmind_v1_base
      backbone_checkpoint_path: weights/backbone/checkpoint_weights_final.pt
      backbone_cfg: weights/backbone/full_config.yaml
      backbone_modality_info_path: weights/modality_info.yaml

      backbone_patch_size: 8
      backbone_modalities:
        - aspect
        - CUR
        - DICE
        - LPSR
        - LPSR_DEN
        - LPSR_DIS
        - slope
        - TMAX
      backbone_new_modalities:
        CUR:
          type: image
          num_channels: 1
          data_range: [-1.0, 1.0]
          patch_size: 8
          input_size: 256
          stats:
            CUR: {gsd_m: 100.0}
        DICE:
          type: image
          num_channels: 1
          data_range: [-1.0, 1.0]
          patch_size: 8
          input_size: 256
          stats:
            DICE: {gsd_m: 100.0}
        LPSR:
          type: image
          num_channels: 1
          data_range: [-1.0, 1.0]
          patch_size: 8
          input_size: 256
          stats:
            LPSR: {gsd_m: 100.0}
        LPSR_DEN:
          type: image
          num_channels: 1
          data_range: [-1.0, 1.0]
          patch_size: 8
          input_size: 256
          stats:
            LPSR_DEN: {gsd_m: 100.0}
        LPSR_DIS:
          type: image
          num_channels: 1
          data_range: [-1.0, 1.0]
          patch_size: 8
          input_size: 256
          stats:
            LPSR_DIS: {gsd_m: 100.0}
        TMAX:
          type: image
          num_channels: 1
          data_range: [-1.0, 1.0]
          patch_size: 8
          input_size: 256
          stats:
            TMAX: {gsd_m: 100.0}
      backbone_merge_method: concat

      # Seed the 6 randomly-initialised new-modality embedders from the pretrained
      # `slope` embedder — same shape (1 channel, patch=8, image=256), so
      # `proj.weight` copies verbatim and `pos_emb` is copied when its buffer
      # shape matches. `mod_emb` (moonfm only) is intentionally left random-init
      # so each modality still has a unique attention signature. This gives the
      # 6 fresh modalities a reasonable starting projection instead of xavier
      # noise; slope was picked because all 6 are 1-channel DTM-derived / thermal
      # / illumination fields that structurally resemble slope.
      backbone_seed_new_modality_from:
        CUR: slope
        DICE: slope
        LPSR: slope
        LPSR_DEN: slope
        LPSR_DIS: slope
        TMAX: slope

      # DPT-style multi-layer ViTDet neck stack. Four block taps (2,5,8,11)
      # feed four distinct SFP scale heads; torchvision FPN unifies to 256 ch;
      # the SumFuseDeepGNDecoder collapses everything into one 64-channel map
      # for the RegressionHead's 1x1 -> 1.
      necks:
        - name: SelectIndices
          indices: [2, 5, 8, 11]
        - name: LearnedTokenProjection
          output_dim: 768
        - name: ReshapeTokensToImage
          remove_cls_token: false
          h: 32
        - name: MultilayerSimpleFeaturePyramid
          out_channels: 256
        - name: FeaturePyramidNetworkNeck
          out_channel: 256
          output_ordered_dict: false
      decoder: SumFuseDeepGNDecoder
      decoder_upsample_output_size: [256, 256]

    freeze_backbone: false
    freeze_decoder: false
    loss: mse
    ignore_index: -1

    # NASA-IMPACT baseline recipe: base_lr=3e-4 for fresh params, backbone_lr_scale=0.5.
    # Our task class treats head_lr as "fresh param LR" and backbone_lr as "top encoder
    # block LR" (LLRD scales lower blocks by layer_decay ** depth_from_top).
    backbone_lr: 1.5e-4
    head_lr: 3.0e-4
    layer_decay: 0.75
    weight_decay: 0.05
    head_weight_decay: 0.05
    betas: [0.9, 0.999]
    warmup_steps: 130          # ~10 epochs at 108 train samples / effective bs=8
    eta_min: 1.0e-6
