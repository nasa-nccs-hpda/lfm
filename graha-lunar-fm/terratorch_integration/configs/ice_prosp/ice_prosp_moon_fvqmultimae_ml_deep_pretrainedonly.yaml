# Ice-prospectivity regression — fvqmultimae (pretrained) with the ml_deep
# recipe, restricted to the 2 PRETRAINED modalities only (aspect + slope).
# Sister of ice_prosp_moon_pretrained_ml_deep_pretrainedonly.yaml.
#
# RUN:
#   bsub -q normal -n 10 -M 64G -gpu "num=1:mode=exclusive_process" \
#        -oo logs/%J.out -eo logs/%J.err \
#        PYTHONPATH=.:$PYTHONPATH \
#        terratorch fit -c terratorch_integration/configs/ice_prosp/ice_prosp_moon_fvqmultimae_ml_deep_pretrainedonly.yaml

seed_everything: 42
custom_modules_path: terratorch_integration
out_dtype: float32

trainer:
  accelerator: gpu
  devices: 1
  precision: '32'
  max_epochs: 600
  check_val_every_n_epoch: 1
  log_every_n_steps: 2
  gradient_clip_val: 0.5
  gradient_clip_algorithm: norm
  accumulate_grad_batches: 2
  logger:
    class_path: TensorBoardLogger
    init_args:
      save_dir: tb_logs/ice_prosp/
      name: prosp-fvqmultimae-ml-deep-pretrainedonly-600ep
  callbacks:
    - class_path: LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: ModelCheckpoint
      init_args:
        dirpath: tb_logs/checkpoints/prosp-fvqmultimae-ml-deep-pretrainedonly-600ep
        monitor: val/RMSE
        mode: min
        filename: best-{epoch:02d}-{val\RMSE:.4f}
        save_top_k: 1
        save_last: false
  default_root_dir: tb_logs/

data:
  class_path: terratorch.datamodules.GenericMultiModalDataModule
  init_args:
    task: 'regression'
    batch_size: 4
    num_workers: 1
    modalities:
      - aspect
      - slope
    train_data_root: data/ice_prosp
    train_label_data_root: data/ice_prosp
    val_data_root: data/ice_prosp
    val_label_data_root: data/ice_prosp
    test_data_root: data/ice_prosp
    test_label_data_root: data/ice_prosp
    predict_data_root: data/ice_prosp
    train_split: data/ice_prosp/train_filtered.txt
    val_split: data/ice_prosp/val_filtered.txt
    test_split: data/ice_prosp/test_filtered.txt

    image_grep:
      aspect: "*_ASP_SIN_COS.tif"
      slope: "*_SLOPE.tif"
    label_grep: "*_PRO.tif"
    no_label_replace: -1
    no_data_replace: 0
    means:
      aspect: [-0.003915, 0.009272]
      slope:  [8.464441]
    stds:
      aspect: [0.668003, 0.669717]
      slope:  [6.172140]
    train_transform:
      - class_path: albumentations.D4
      - class_path: albumentations.pytorch.transforms.ToTensorV2

model:
  class_path: terratorch_integration.LunarPixelwiseRegressionTask
  init_args:
    model_factory: EncoderDecoderFactory
    model_args:
      backbone: lunar_fvqmultimae
      backbone_checkpoint_path: weights/fvqmultimae/nasa_team_ckpt.pth
      backbone_patch_size: 8
      backbone_image_size: 256
      backbone_modalities:
        - aspect
        - slope
      backbone_new_modalities: {}
      backbone_merge_method: concat

      necks:
        - name: SelectIndices
          indices: [2, 5, 8, 11]
        - name: LearnedTokenProjection
          output_dim: 768
        - name: ReshapeTokensToImage
          remove_cls_token: false
          h: 32
        - name: MultilayerSimpleFeaturePyramid
          out_channels: 256
        - name: FeaturePyramidNetworkNeck
          out_channel: 256
          output_ordered_dict: false
      decoder: SumFuseDeepGNDecoder
      decoder_upsample_output_size: [256, 256]

    freeze_backbone: false
    freeze_decoder: false
    loss: mse
    ignore_index: -1

    backbone_lr: 1.5e-4
    head_lr: 3.0e-4
    layer_decay: 0.75
    weight_decay: 0.05
    head_weight_decay: 0.05
    betas: [0.9, 0.999]
    warmup_steps: 130
    eta_min: 1.0e-6
