# Stacked-input variant with a RANDOMLY-INITIALISED Fourier-VQ MultiMAE
# backbone. All 8 image modalities are concatenated channelwise into a single
# 9-channel tensor (aspect=2 + CUR/DICE/LPSR/LPSR_DEN/LPSR_DIS/slope/TMAX = 7)
# and fed as one new "stacked" modality with a fresh 9-channel input adapter.
#
# Compared to ice_prosp_moon_fvqmultimae_stacked.yaml: no checkpoint is loaded,
# so encoder blocks are also random. All parameters (adapter + encoder + necks
# + decoder + head) train together at a unified 1e-4 with no LLRD and a
# shorter warmup — mirroring the ice_prosp_moon_random_stacked.yaml recipe.
#
# RUN:
#   bsub -q normal -n 10 -M 64G -gpu "num=1:mode=exclusive_process" \
#        -oo logs/%J.out -eo logs/%J.err \
#        PYTHONPATH=.:$PYTHONPATH \
#        terratorch fit -c terratorch_integration/configs/ice_prosp/ice_prosp_moon_fvqmultimae_random_stacked.yaml

seed_everything: 42
custom_modules_path: terratorch_integration
out_dtype: float32

trainer:
  accelerator: gpu
  devices: 1
  precision: '32'
  max_epochs: 600
  check_val_every_n_epoch: 1
  log_every_n_steps: 2
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  logger:
    class_path: TensorBoardLogger
    init_args:
      save_dir: tb_logs/ice_prosp/
      name: prosp-fvqmultimae-random-stacked-600ep
  callbacks:
    - class_path: LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: ModelCheckpoint
      init_args:
        dirpath: tb_logs/checkpoints/prosp-fvqmultimae-random-stacked-600ep
        monitor: val/RMSE
        mode: min
        filename: best-{epoch:02d}-{val\RMSE:.4f}
        save_top_k: 1
        save_last: false
  default_root_dir: tb_logs/

data:
  class_path: terratorch.datamodules.GenericMultiModalDataModule
  init_args:
    task: 'regression'
    batch_size: 8
    num_workers: 1
    # concat_bands=True stacks all image modalities channelwise into a single
    # (B, 9, H, W) "image" tensor. Order below determines channel order:
    # 0-1 aspect, 2 CUR, 3 DICE, 4 LPSR, 5 LPSR_DEN, 6 LPSR_DIS, 7 slope, 8 TMAX.
    concat_bands: true
    modalities:
      - aspect
      - CUR
      - DICE
      - LPSR
      - LPSR_DEN
      - LPSR_DIS
      - slope
      - TMAX
    train_data_root: data/ice_prosp
    train_label_data_root: data/ice_prosp
    val_data_root: data/ice_prosp
    val_label_data_root: data/ice_prosp
    test_data_root: data/ice_prosp
    test_label_data_root: data/ice_prosp
    predict_data_root: data/ice_prosp
    train_split: data/ice_prosp/train_filtered.txt
    val_split: data/ice_prosp/val_filtered.txt
    test_split: data/ice_prosp/test_filtered.txt

    image_grep:
      aspect: "*_ASP_SIN_COS.tif"
      CUR: "*_CUR.tif"
      DICE: "*_DICE.tif"
      LPSR: "*_LPSR.tif"
      LPSR_DEN: "*_LPSR_DEN.tif"
      LPSR_DIS: "*_LPSR_DIS.tif"
      slope: "*_SLOPE.tif"
      TMAX: "*_TMAX.tif"
    label_grep: "*_PRO.tif"
    no_label_replace: -1
    no_data_replace: 0
    means:
      aspect:   [-0.003915, 0.009272]
      CUR:      [0]
      DICE:     [0.429733]
      LPSR:     [0.062075]
      LPSR_DEN: [0.062062]
      LPSR_DIS: [2115.858434]
      slope:    [8.464441]
      TMAX:     [228.021751]
    stds:
      aspect:   [0.668003, 0.669717]
      CUR:      [0.000280]
      DICE:     [0.454594]
      LPSR:     [0.241292]
      LPSR_DEN: [0.195937]
      LPSR_DIS: [2115.858434]
      slope:    [6.172140]
      TMAX:     [47.689147]
    train_transform:
      - class_path: albumentations.D4
      - class_path: albumentations.pytorch.transforms.ToTensorV2

model:
  class_path: terratorch_integration.LunarPixelwiseRegressionTask
  init_args:
    model_factory: EncoderDecoderFactory
    model_args:
      backbone: lunar_fvqmultimae
      # No backbone_checkpoint_path — the backbone architecture is defined
      # inline, but weights start random.
      backbone_patch_size: 8
      backbone_image_size: 256
      # Single new "stacked" modality carrying all 9 concatenated channels.
      backbone_modalities:
        - stacked
      backbone_new_modalities:
        stacked: {num_channels: 9, patch_size: 8, image_size: 256}
      backbone_merge_method: concat
      necks:
        - name: SelectIndices
          indices: [2, 5, 8, 11]
        # - name: LearnedTokenProjection
        #   output_dim: 768
        - name: ReshapeTokensToImage
          remove_cls_token: false
          h: 32
        - name: LearnedInterpolateToPyramidal
      decoder: UNetDecoder
      decoder_channels: [512, 256, 128, 64]

    freeze_backbone: false
    freeze_decoder: false
    loss: mse
    ignore_index: -1

    # Random-init: every parameter is fresh, so no LLRD and no head/backbone
    # split — a single 1e-4 across the whole model. layer_decay=1.0 disables
    # depth-wise scaling.
    backbone_lr: 1.0e-4
    head_lr: 1.0e-4
    layer_decay: 1.0
    weight_decay: 1.0e-4
    head_weight_decay: 1.0e-4
    betas: [0.9, 0.999]
    warmup_steps: 100
    eta_min: 1.0e-6
