# Ice-prospectivity regression — timm ViT-B/16 with ImageNet-MAE pretraining,
# NASA-IMPACT "TUNEICE ml_deep" recipe.
#
# Real transformer -> LLRD 0.75 is active on the encoder blocks (unlike the
# ConvNeXt/ResNet baselines). The neck stack matches the FM ml_deep recipe:
# multilayer taps at blocks [2, 5, 8, 11] -> MultilayerSimpleFeaturePyramid ->
# torchvision FPN -> SumFuseDeepGNDecoder -> RegressionHead.
#
# Note: patch_size=16 (not 8), so ReshapeTokensToImage h=16 (256/16=16).
# Uses concat_bands: all 8 modalities stacked as a 9-channel input tensor.
#
# RUN:
#   bsub -q normal -n 10 -M 64G -gpu "num=1:mode=exclusive_process" \
#        -oo logs/%J.out -eo logs/%J.err \
#        PYTHONPATH=.:$PYTHONPATH \
#        terratorch fit -c terratorch_integration/configs/ice_prosp/ice_prosp_moon_vit_ml_deep.yaml

seed_everything: 42
custom_modules_path: terratorch_integration
out_dtype: float32

trainer:
  accelerator: gpu
  devices: 1
  precision: '32'
  max_epochs: 600
  check_val_every_n_epoch: 1
  log_every_n_steps: 2
  gradient_clip_val: 0.5
  gradient_clip_algorithm: norm
  accumulate_grad_batches: 2
  logger:
    class_path: TensorBoardLogger
    init_args:
      save_dir: tb_logs/ice_prosp/
      name: prosp-vit-mae-ml-deep-600ep
  callbacks:
    - class_path: LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: ModelCheckpoint
      init_args:
        dirpath: tb_logs/checkpoints/prosp-vit-mae-ml-deep-600ep
        monitor: val/RMSE
        mode: min
        filename: best-{epoch:02d}-{val\RMSE:.4f}
        save_top_k: 1
        save_last: false
  default_root_dir: tb_logs/

data:
  class_path: terratorch.datamodules.GenericMultiModalDataModule
  init_args:
    task: 'regression'
    batch_size: 4
    num_workers: 1
    modalities:
      - aspect
      - CUR
      - DICE
      - LPSR
      - LPSR_DEN
      - LPSR_DIS
      - slope
      - TMAX
    train_data_root: data/ice_prosp
    train_label_data_root: data/ice_prosp
    val_data_root: data/ice_prosp
    val_label_data_root: data/ice_prosp
    test_data_root: data/ice_prosp
    test_label_data_root: data/ice_prosp
    predict_data_root: data/ice_prosp
    train_split: data/ice_prosp/train_filtered.txt
    val_split: data/ice_prosp/val_filtered.txt
    test_split: data/ice_prosp/test_filtered.txt

    image_grep:
      aspect: "*_ASP_SIN_COS.tif"
      CUR: "*_CUR.tif"
      DICE: "*_DICE.tif"
      LPSR: "*_LPSR.tif"
      LPSR_DEN: "*_LPSR_DEN.tif"
      LPSR_DIS: "*_LPSR_DIS.tif"
      slope: "*_SLOPE.tif"
      TMAX: "*_TMAX.tif"
    label_grep: "*_PRO.tif"
    no_label_replace: -1
    no_data_replace: 0
    means:
      aspect:   [-0.003915, 0.009272]
      CUR:      [0]
      DICE:     [0.429733]
      LPSR:     [0.062075]
      LPSR_DEN: [0.062062]
      LPSR_DIS: [2115.858434]
      slope:    [8.464441]
      TMAX:     [228.021751]
    stds:
      aspect:   [0.668003, 0.669717]
      CUR:      [0.000280]
      DICE:     [0.454594]
      LPSR:     [0.241292]
      LPSR_DEN: [0.195937]
      LPSR_DIS: [2115.858434]
      slope:    [6.172140]
      TMAX:     [47.689147]
    concat_bands: true
    train_transform:
      - class_path: albumentations.D4
      - class_path: albumentations.pytorch.transforms.ToTensorV2

model:
  class_path: terratorch_integration.LunarPixelwiseRegressionTask
  init_args:
    model_factory: EncoderDecoderFactory
    model_args:
      # timm ViT-B/16, ImageNet-MAE pretrained; img_size=256 triggers pos_emb
      # interpolation from the 224² grid.
      backbone: timm_vit_base_patch16_224.mae
      backbone_pretrained: true
      backbone_in_chans: 9
      backbone_img_size: 256
      backbone_out_indices: [2, 5, 8, 11]

      # Same DPT-style multilayer neck as the FM ml_deep configs, but with
      # patch=16 -> token grid 16x16 (h=16, not 32).
      necks:
        - name: LearnedTokenProjection
          output_dim: 768
        - name: ReshapeTokensToImage
          remove_cls_token: true       # timm ViT prepends CLS
          h: 16
        - name: MultilayerSimpleFeaturePyramid
          out_channels: 256
        - name: FeaturePyramidNetworkNeck
          out_channel: 256
          output_ordered_dict: false
      decoder: SumFuseDeepGNDecoder
      decoder_upsample_output_size: [256, 256]

    freeze_backbone: false
    freeze_decoder: false
    loss: mse
    ignore_index: -1

    # timm ViT param names contain `.blocks.<i>.` so LLRD 0.75 is active.
    backbone_lr: 1.5e-4
    head_lr: 3.0e-4
    layer_decay: 0.75
    weight_decay: 0.05
    head_weight_decay: 0.05
    betas: [0.9, 0.999]
    warmup_steps: 130
    eta_min: 1.0e-6
