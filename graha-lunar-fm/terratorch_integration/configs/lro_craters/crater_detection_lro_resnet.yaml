# Lunar Crater Detection — LRO grayscale JPGs
# Backbone: ResNet-50, ImageNet-pretrained via timm.
#
# LRO images are single-channel grayscale JPGs, so we feed the raw (1, H, W)
# tensor via output_mode="image" and let timm's adapt_input_conv average the
# ImageNet RGB filters down to 1 channel (in_chans=1 + pretrained=True).
#
# RUN:
#   PYTHONPATH=. \
#   terratorch fit --config terratorch_integration/configs/crater_detection_lro_resnet.yaml
seed_everything: 42
custom_modules_path: terratorch_integration

trainer:
  accelerator: gpu
  devices: 1
  precision: "32"
  max_epochs: 100
  check_val_every_n_epoch: 1
  log_every_n_steps: 10
  enable_checkpointing: true
  logger:
    class_path: TensorBoardLogger
    init_args:
      save_dir: tb_logs/lro-crater
      name: crater-detection-lro-resnet-pretrained-trans-new-task
  callbacks:
    - class_path: LearningRateMonitor
      init_args:
        logging_interval: epoch
    - class_path: ModelCheckpoint
      init_args:
        dirpath: tb_logs/checkpoints/crater-detection-lro-resnet-pretrained-trans-new-task
        monitor: val_map
        mode: max
        filename: best-{epoch:02d}-{val_map:.3f}
        save_last: true
    - class_path: EarlyStopping
      init_args:
        monitor: val_map
        mode: max
        patience: 15

data:
  class_path: terratorch_integration.data_adapter.LunarCraterDataModule
  init_args:
    root: data/LRO_Craters
    batch_size: 4
    num_workers: 4
    image_size: 512              # matches published-baseline eval resolution
    output_mode: image           # (1, H, W) — timm adapts pretrained conv1 to 1 channel
    norm_mean: 0.251561
    norm_std: 0.121082
    train_transforms:
      class_path: terratorch_integration.data_utils.D4DetectionTransform
      init_args:
        image_keys: [image]
        p: 1.0

model:
  class_path: terratorch_integration.LunarObjectDetectionTask
  init_args:
    model_factory: ObjectDetectionModelFactory
    model_args:
      framework: faster-rcnn
      backbone: timm_resnet50

      backbone_pretrained: true      # load ImageNet weights
      backbone_in_chans: 1           # grayscale — adapt_input_conv averages RGB filters
      backbone_features_only: true
      backbone_out_indices: [1, 2, 3, 4]   # skip stem, use 4 res stages

      num_classes: 2
      framework_min_size: 512
      framework_max_size: 512

      in_channels: 1

      # ResNet-50 features_only out_channels: [256, 512, 1024, 2048] (indices 1-4).
      # FPN takes the 4 spatial maps directly — no token reshaping needed.
      necks:
        - name: SelectIndices
          indices: [0, 1, 2, 3]
        - name: FeaturePyramidNetworkNeck

    freeze_backbone: false
    freeze_decoder: false

    class_names:
      - Background
      - Crater

    anchor_sizes: [[8], [16], [32], [64]]
    anchor_aspect_ratios: [0.5, 1.0, 2.0]
    backbone_lr: 1.0e-4
    head_lr: 1.0e-4
    layer_decay: 1.0
    weight_decay: 1.0e-4       # matches ResNet-typical WD, not ViT's 0.05
    head_weight_decay: 1.0e-4
    betas: [0.9, 0.999]
    warmup_steps: 0
