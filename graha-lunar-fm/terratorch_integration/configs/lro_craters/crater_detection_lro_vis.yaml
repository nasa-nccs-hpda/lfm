# Lunar Crater Detection — LRO grayscale JPGs fed to the WAC-pretrained backbone
#
# LRO_Craters ships as 512x512 single-channel JPGs with COCO annotations
# (train2017/, val2017/, annotations/instances_*.json).  To reuse the WAC
# pretrained backbone we:
#   1. resize to 256x256 (matches the 16x16 patch grid at patch_size=16),
#   2. scale to [0, 1] and normalize with the LRO training-split statistics
#      computed over the 538 train JPGs: mean=0.251561, std=0.121082,
#   3. replicate the single channel across 5 bands so the pretrained "vis"
#      patch embedding (num_channels=5) sees a matching input tensor.
#
# The dataset emits "image" as a (5, H, W) packed tensor consumed by
# LunarBackbone via its _unpack_modalities helper — exactly the same path
# used by the WAC and NAC+DTM datasets in "packed" mode.  A duplicate "vis"
# key is written for plot() only; the task itself reads "image" / "boxes".
#
# RUN:
#   PYTHONPATH=.:$PYTHONPATH \
#   terratorch fit --config terratorch_integration/configs/crater_detection_lro_vis.yaml
seed_everything: 42
custom_modules_path: terratorch_integration

trainer:
  accelerator: gpu
  devices: 1
  precision: "32"
  max_epochs: 50
  check_val_every_n_epoch: 1
  log_every_n_steps: 10
  enable_checkpointing: true
  logger:
    class_path: TensorBoardLogger
    init_args:
      save_dir: tb_logs/lro-crater
      name: crater-detection-lro-vis-trans-new-task
  callbacks:
    - class_path: LearningRateMonitor
      init_args:
        logging_interval: epoch
    - class_path: ModelCheckpoint
      init_args:
        dirpath: tb_logs/checkpoints/crater-detection-lro-vis-trans-new-task
        monitor: val_map
        mode: max
        filename: best-{epoch:02d}-{val_map:.3f}
        save_last: true
    - class_path: EarlyStopping
      init_args:
        monitor: val_map
        mode: max
        patience: 15

data:
  class_path: terratorch_integration.data_adapter.LunarCraterDataModule
  init_args:
    root: data/LRO_Craters
    batch_size: 4
    num_workers: 4
    image_size: 512              # matches published-baseline eval resolution
    output_mode: vis             # (5, H, W) packed tensor for LunarBackbone
    replicate_bands: 5           # vis modality num_channels of the pretrained ckpt
    # LRO train2017/ grayscale stats (values in [0, 1] after /255):
    norm_mean: 0.251561
    norm_std: 0.121082
    # D4 group augmentation (0/90/180/270 rot + optional horizontal flip)
    # applied per-sample to image, vis, and boxes together. Val/test stay
    # identity so eval numbers remain directly comparable.
    train_transforms:
      class_path: terratorch_integration.data_utils.D4DetectionTransform
      init_args:
        image_keys: [image, vis]
        p: 1.0

model:
  class_path: terratorch_integration.LunarObjectDetectionTask
  init_args:
    model_factory: ObjectDetectionModelFactory
    model_args:
      framework: faster-rcnn
      backbone: lunarmind_v1_base
      backbone_checkpoint_path: weights/backbone/checkpoint_weights_final.pt
      backbone_cfg: weights/backbone/full_config.yaml
      backbone_modality_info_path: weights/modality_info.yaml

      num_classes: 2             # background + crater
      framework_min_size: 512
      framework_max_size: 512

      backbone_modalities:
        - vis                    # (B, 5, 512, 512) — grayscale replicated to 5 bands

      # Pretrained vis.pos_emb has 256 spatial tokens (16×16 at ps=16 / 256px).
      # We run at 512px with ps=8 to keep the same 64×64 token layout used by
      # the WAC baselines; the pos_emb is bilinearly interpolated at load time.
      backbone_patch_size: 8
      backbone_remove_register_tokens: false
      backbone_merge_method: concat

      in_channels: 5             # vis has 5 spectral bands (replicated grayscale)
      necks:
        - name: SelectIndices
          indices: [2, 5, 8, 11]
        - name: ReshapeTokensToImage
          remove_cls_token: false
          h: 64                  # 4096 tokens = 64×64 spatial grid at patch_size=8
        - name: LearnedInterpolateToPyramidal
        - name: FeaturePyramidNetworkNeck

    freeze_backbone: false
    freeze_decoder: false

    class_names:
      - Background
      - Crater

    anchor_sizes: [[8], [16], [32], [64]]
    anchor_aspect_ratios: [0.5, 1.0, 2.0]

    # LLRD: pretrained backbone gets smaller LR than randomly-init'd heads.
    # 12 blocks, layer_decay=0.75 → bottom block ≈ 0.75^12 × backbone_lr ≈ 1.6e-6.
    backbone_lr: 5.0e-5
    head_lr: 1.0e-4
    layer_decay: 0.75
    weight_decay: 0.05
    head_weight_decay: 1.0e-4
    betas: [0.9, 0.999]
    warmup_steps: 500
    eta_min: 1.0e-6

# NOTE: intentionally NO top-level optimizer / lr_scheduler blocks.
# Lightning CLI monkey-patches configure_optimizers when present, which
# would silently discard the LLRD param groups defined by the task.
