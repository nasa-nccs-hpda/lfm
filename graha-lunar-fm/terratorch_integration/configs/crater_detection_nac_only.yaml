# Lunar Crater Detection — NAC only
# Backbone: lunarmind_v1_base from 100k pretraining (matrix_base_vit_4g_8w_128b_1r_250s_6pf)
#
# RUN:
#   PYTHONPATH=/u/fraccaro/Projects/Lunar-FM:$PYTHONPATH \
#   terratorch fit --config terratorch_integration/configs/crater_detection_nac_only.yaml
##   PYTHONPATH=. \
#   terratorch fit --config terratorch_integration/configs/crater_detection_nac_only.yaml
# Checkpoint facts (derived from weights):
#   embed_dim=768, encoder_depth=12, patch_size=16 (nac.pos_emb=(1,256,768)),
#   num_register_tokens=0
seed_everything: 42
custom_modules_path: terratorch_integration

trainer:
  accelerator: cpu
  devices: 1
  precision: "32"
  max_epochs: 100
  check_val_every_n_epoch: 1
  log_every_n_steps: 5
  logger:
    class_path: TensorBoardLogger
    init_args:
      save_dir: tb_logs/
      name: crater-detection-nac-only
  callbacks:
    - class_path: LearningRateMonitor
      init_args:
        logging_interval: epoch
    - class_path: ModelCheckpoint
      init_args:
        dirpath: tb_logs/checkpoints/crater-detection-nac-only
        monitor: val_map
        mode: max
        filename: best-{epoch:02d}-{val_map:.3f}
        save_top_k: 3
        save_last: true

data:
  class_path: terratorch_integration.data_adapter.LunarNACDTMDataModule
  init_args:
    data_dir: data/NAC_handlabeled_1m_256
    metadata_file: data/NAC_handlabeled_1m_256/metadata.parquet
    annotations_file: data/NAC_handlabeled_1m_256/nac_nac_handlabeled_annotations.json
    modalities: [nac]

    output_mode: packed
    batch_size: 4
    num_workers: 0
    image_size: 256
    min_diameter_m: 5.0
    # NAC normalisation (see multimodal config for provenance)
    nac_mask_threshold: -1.0
    nac_mask_fill_value: 0.0
    nac_norm_mean: 0.451789
    nac_norm_std: 0.169636

model:
  class_path: terratorch.tasks.ObjectDetectionTask
  init_args:
    model_factory: ObjectDetectionModelFactory
    model_args:
      framework: faster-rcnn
      backbone: lunarmind_v1_base
      backbone_checkpoint_path: weights/backbone/checkpoint_weights_final.pt
      backbone_cfg: weights/backbone/full_config.yaml
      num_classes: 2             # background + crater
      framework_min_size: 256
      framework_max_size: 256
      backbone_modalities:
        - nac                    # (B, 1, 256, 256) — NAC grayscale

      backbone_patch_size: 16
      backbone_remove_register_tokens: false  # checkpoint has 0 register tokens
      # Single modality: no merge needed (only 256 image tokens in the stream)
      backbone_merge_method: null

      in_channels: 1             # packed: 1 NAC channel only
      necks:
        - name: SelectIndices
          indices: [2, 5, 8, 11]  # 4 equidistant layers from 12-layer encoder
        # - name: LearnedTokenProjection
        #   output_dim: 768
        - name: ReshapeTokensToImage
          remove_cls_token: false
          h: 16                  # matches multimodal config; verify grid matches token count
        - name: LearnedInterpolateToPyramidal
        - name: FeaturePyramidNetworkNeck

    freeze_backbone: false
    freeze_decoder: false

    class_names:
      - Background
      - Crater

optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 1.0e-4
    weight_decay: 0.05
    betas: [0.9, 0.98]

lr_scheduler:
  class_path: CosineAnnealingLR
  init_args:
    T_max: 100
    eta_min: 1.0e-6
