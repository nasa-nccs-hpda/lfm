# Lunar IMP Semantic Segmentation — 10% subsample, stock TerraTorch task
# Same data + backbone as imp_segmentation_nac_10pct.yaml, but uses
# terratorch.tasks.SemanticSegmentationTask (no LLRD, no split-LR, no built-in
# warmup+cosine) with a flat AdamW at lr=1e-4.  Debug-plateau variant.
#
# RUN:
#   PYTHONPATH=. \
#   terratorch fit --config terratorch_integration/configs/imp_segmentation_nac_10pct_stock.yaml
seed_everything: 42
custom_modules_path: terratorch_integration

trainer:
  accelerator: gpu
  devices: 1
  precision: "32"
  max_epochs: 50
  check_val_every_n_epoch: 1
  log_every_n_steps: 5
  logger:
    class_path: TensorBoardLogger
    init_args:
      save_dir: tb_logs/
      name: imp-segmentation-nac-10pct-stock
  callbacks:
    - class_path: LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: EarlyStopping
      init_args:
        monitor: val/loss
        mode: min
        patience: 8
        min_delta: 1.0e-4
    - class_path: ModelCheckpoint
      init_args:
        dirpath: tb_logs/checkpoints/imp-segmentation-nac-10pct-stock
        monitor: val/loss
        mode: min
        filename: best-{epoch:02d}-{val/loss:.3f}
        save_top_k: 1
        save_last: true

data:
  class_path: terratorch_integration.data_adapter_imp.LunarImpSegDataModule
  init_args:
    root: data/IMP_segmentation_dataset
    batch_size: 16
    num_workers: 0
    image_size: 256
    band_name: data
    per_image_norm: false
    norm_means: [0.030536279938594046]
    norm_stds:  [0.01734697969609096]
    max_pixel_value: 1.0
    train_fraction: 0.2
    fraction_seed: 42
    train_transforms:
      class_path: terratorch_integration.data_utils.D4Transform
      init_args:
        mask_key: mask
        p: 1.0

model:
  class_path: terratorch.tasks.SemanticSegmentationTask
  init_args:
    model_factory: EncoderDecoderFactory
    model_args:
      backbone: lunarmind_v1_base
      backbone_checkpoint_path: weights/backbone/checkpoint_weights_final.pt
      backbone_cfg: weights/backbone/full_config.yaml
      backbone_modality_info_path: weights/modality_info.yaml
      backbone_modalities:
        - nac
      backbone_patch_size: 16
      backbone_remove_register_tokens: false
      backbone_merge_method: null
      necks:
        - name: SelectIndices
          indices: [2, 5, 8, 11]
        - name: ReshapeTokensToImage
          remove_cls_token: false
          h: 16
        - name: LearnedInterpolateToPyramidal
      decoder: UNetDecoder
      decoder_channels: [512, 256, 128, 64]
      head_channel_list: [256]
      num_classes: 2
      head_dropout: 0.0
    loss: ce
    class_weights: [1.0, 10.0]
    ignore_index: -100
    class_names:
      - Background
      - IMP
    freeze_backbone: false
    freeze_decoder: false
    plot_on_val: 5

# Flat AdamW at lr=1e-4 (uniform across encoder + decoder + head).
optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 1.0e-4
    weight_decay: 0.05
    betas: [0.9, 0.98]
