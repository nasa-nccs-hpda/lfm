# Ice-prospectivity regression — Fourier-VQ MultiMAE backbone with the
# NASA-IMPACT "TUNEICE_gfft_repl511_ml_refdtm" recipe (multilayer + deep GN
# head + sum-fuse). Sister of ice_prosp_moon_pretrained_ml_deep.yaml.
#
# RUN:
#   bsub -q normal -n 10 -M 64G -gpu "num=1:mode=exclusive_process" \
#        -oo logs/%J.out -eo logs/%J.err \
#        PYTHONPATH=.:$PYTHONPATH \
#        terratorch fit -c terratorch_integration/configs/ice_prosp/ice_prosp_moon_fvqmultimae_ml_deep.yaml

seed_everything: 42
custom_modules_path: terratorch_integration
out_dtype: float32

trainer:
  accelerator: auto
  devices: 1
  precision: '32'
  max_epochs: 600
  check_val_every_n_epoch: 1
  log_every_n_steps: 2
  gradient_clip_val: 0.5
  gradient_clip_algorithm: norm
  accumulate_grad_batches: 2
  logger:
    class_path: TensorBoardLogger
    init_args:
      save_dir: tb_logs/
      name: prospecitivity-gfft
  callbacks:
    - class_path: LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: ModelCheckpoint
      init_args:
        dirpath: tb_logs/checkpoints/prospecitivity-gfft
        monitor: val/RMSE
        mode: min
        filename: best-{epoch:02d}-{val\RMSE:.4f}
        save_top_k: 1
        save_last: false
  default_root_dir: tb_logs/

data:
  class_path: terratorch.datamodules.GenericMultiModalDataModule
  init_args:
    task: 'regression'
    batch_size: 4
    num_workers: 1
    modalities:
      - aspect
      - CUR
      - DICE
      - LPSR
      - LPSR_DEN
      - LPSR_DIS
      - slope
      - TMAX
    train_data_root:
    train_label_data_root:
    val_data_root:
    val_label_data_root:
    test_data_root:
    test_label_data_root:
    predict_data_root:
    train_split:
    val_split:
    test_split:


    image_grep:
      aspect: "*_ASP_SIN_COS.tif"
      CUR: "*_CUR.tif"
      DICE: "*_DICE.tif"
      LPSR: "*_LPSR.tif"
      LPSR_DEN: "*_LPSR_DEN.tif"
      LPSR_DIS: "*_LPSR_DIS.tif"
      slope: "*_SLOPE.tif"
      TMAX: "*_TMAX.tif"
    label_grep: "*_PRO.tif"
    no_label_replace: -1
    no_data_replace: 0
    means:
      aspect:   [-0.003915, 0.009272]
      CUR:      [0]
      DICE:     [0.429733]
      LPSR:     [0.062075]
      LPSR_DEN: [0.062062]
      LPSR_DIS: [2115.858434]
      slope:    [8.464441]
      TMAX:     [228.021751]
    stds:
      aspect:   [0.668003, 0.669717]
      CUR:      [0.000280]
      DICE:     [0.454594]
      LPSR:     [0.241292]
      LPSR_DEN: [0.195937]
      LPSR_DIS: [2115.858434]
      slope:    [6.172140]
      TMAX:     [47.689147]
    train_transform:
      - class_path: albumentations.D4
      - class_path: albumentations.pytorch.transforms.ToTensorV2

model:
  class_path: terratorch_integration.LunarPixelwiseRegressionTask
  init_args:
    model_factory: EncoderDecoderFactory
    model_args:
      backbone: lunar_fvqmultimae
      backbone_checkpoint_path: /explore/nobackup/projects/lfm/rohit/lunar_baselines/gfft_lunar/experiments/GFFT_lunar_wac_mm_fullres_repl_p8_gh200_npz/weights/epoch_511_loss_0.164.pth
      backbone_patch_size: 8
      backbone_image_size: 256
      backbone_modalities:
        - aspect
        - CUR
        - DICE
        - LPSR
        - LPSR_DEN
        - LPSR_DIS
        - slope
        - TMAX
      backbone_new_modalities:
        CUR:      {num_channels: 1, patch_size: 8, image_size: 256}
        DICE:     {num_channels: 1, patch_size: 8, image_size: 256}
        LPSR:     {num_channels: 1, patch_size: 8, image_size: 256}
        LPSR_DEN: {num_channels: 1, patch_size: 8, image_size: 256}
        LPSR_DIS: {num_channels: 1, patch_size: 8, image_size: 256}
        TMAX:     {num_channels: 1, patch_size: 8, image_size: 256}
      backbone_merge_method: concat

      # Seed the 6 randomly-initialised new-modality input adapters from the
      # pretrained `slope` adapter — same shape (1 channel, patch=8, image=256),
      # so `proj.weight/bias` copy verbatim and `pos_emb` is copied when its
      # buffer shape matches. Slope was picked because all 6 new modalities are
      # 1-channel DTM-derived / thermal / illumination fields that structurally
      # resemble slope; the 2-channel `aspect` would require sum-inflation.
      backbone_seed_new_modality_from:
        CUR: slope
        DICE: slope
        LPSR: slope
        LPSR_DEN: slope
        LPSR_DIS: slope
        TMAX: slope

      necks:
        - name: SelectIndices
          indices: [2, 5, 8, 11]
        - name: LearnedTokenProjection
          output_dim: 768
        - name: ReshapeTokensToImage
          remove_cls_token: false
          h: 32
        - name: MultilayerSimpleFeaturePyramid
          out_channels: 256
        - name: FeaturePyramidNetworkNeck
          out_channel: 256
          output_ordered_dict: false
      decoder: SumFuseDeepGNDecoder
      decoder_upsample_output_size: [256, 256]

    freeze_backbone: false
    freeze_decoder: false
    loss: mse
    ignore_index: -1

    backbone_lr: 1.5e-4
    head_lr: 3.0e-4
    layer_decay: 0.75
    weight_decay: 0.05
    head_weight_decay: 0.05
    betas: [0.9, 0.999]
    warmup_steps: 130
    eta_min: 1.0e-6
