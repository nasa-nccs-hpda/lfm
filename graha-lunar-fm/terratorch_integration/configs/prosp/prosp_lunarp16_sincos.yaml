# Example: Adding a New Modality to Pre-trained TerraMind Model
# Based on crater_detection_15k_v4_nac.yaml
# Demonstrates adding a custom NAC modality (nac_custom) that wasn't in the original training
#
# RUN with PYTHONPATH:
#   PYTHONPATH=. terratorch fit --config terratorch_integration/configs/example_new_modality.yaml

seed_everything: 42
custom_modules_path: terratorch_integration
out_dtype: float32
trainer:
  accelerator: gpu
  devices: 1
  precision: '32'
  max_epochs: 100
  check_val_every_n_epoch: 5
  log_every_n_steps: 2
  logger:
    class_path: TensorBoardLogger
    init_args:
      save_dir: tb_logs/
      name: prosp-lunar-p16-sincos
  callbacks:
    - class_path: LearningRateMonitor
      init_args:
        logging_interval: epoch
    - class_path: EarlyStopping
      init_args:
        monitor: val/RMSE
        patience: 5 
  default_root_dir: tb_logs/inf_res/

data:
  class_path: terratorch.datamodules.GenericMultiModalDataModule
  init_args:
    task: 'regression'
    batch_size: 8
    num_workers: 1
    modalities: # Define names of modalities
      - aspect
      - CUR
      - DICE
      - LPSR
      - LPSR_DEN
      - LPSR_DIS
      - slope
      - TMAX
    # Data roots are defined as dicts with modalities as keys
    train_data_root: data/patches_from_geotiff_new
    train_label_data_root: data/patches_from_geotiff_new
    val_data_root: data/patches_from_geotiff_new
    val_label_data_root: data/patches_from_geotiff_new
    test_data_root: data/patches_from_geotiff_new
    test_label_data_root: data/patches_from_geotiff_new
    predict_data_root:  data/patches_from_geotiff_new
    train_split: data/patches_from_geotiff_new/train_filtered.txt
    val_split: data/patches_from_geotiff_new/val_filtered.txt
    test_split: data/patches_from_geotiff_new/test_filtered.txt

    image_grep: 
      aspect: "*_ASP_SIN_COS.tif"
      CUR: "*_CUR.tif"
      DICE: "*_DICE.tif"
      LPSR: "*_LPSR.tif"
      LPSR_DEN: "*_LPSR_DEN.tif"
      LPSR_DIS: "*_LPSR_DIS.tif"
      slope: "*_SLOPE.tif"
      TMAX: "*_TMAX.tif"
    label_grep: "*_PRO.tif"
    # allow_substring_file_names: True
    no_label_replace: -1
    no_data_replace: 0
    # Define standardization values as dicts
    means:
      aspect:
        - -0.003915
        - 0.009272
      CUR:
        - 0
      DICE: 
        - 0.429733
      LPSR: 
        - 0.062075
      LPSR_DEN: 
        - 0.062062
      LPSR_DIS:
        - 2115.858434
      slope: 
        - 8.464441
      TMAX:
        - 228.021751
    stds:
      aspect:
        - 0.668003
        - 0.669717
      CUR:
        - 0.000280
      DICE: 
        -  0.454594
      LPSR: 
        - 0.241292
      LPSR_DEN: 
        - 0.195937
      LPSR_DIS:
        - 2115.858434
      slope: 
        - 6.172140
      TMAX:
        - 47.689147
    # Transforms are shared between all image modalities (e.g. same crop area)
    train_transform:
      - class_path: albumentations.D4
      - class_path: albumentations.pytorch.transforms.ToTensorV2


model:
  class_path: terratorch.tasks.PixelwiseRegressionTask
  init_args:
    model_factory: EncoderDecoderFactory
    model_args:
      backbone: lunarmind_v1_base
      backbone_checkpoint_path: weights/backbone/checkpoint_weights_final.pt
      backbone_cfg: weights/backbone/full_config.yaml
      backbone_modality_info_path: weights/modality_info.yaml
      
      # ============================================================
      # NEW MODALITY:
      # ============================================================
      # The checkpoint was trained on vis, dtm, slope, aspect, etc.
      # but NOT on nac_custom. We're adding it here dynamically.
      # backbone_patch_size: 8  # Optional override for modality-derived patch size
      backbone_modalities:
        - aspect
        - CUR # NEW modality (not in checkpoint)
        - DICE # NEW modality (not in checkpoint)
        - LPSR # NEW modality (not in checkpoint)
        - LPSR_DEN # NEW modality (not in checkpoint)
        - LPSR_DIS # NEW modality (not in checkpoint)
        - slope
        - TMAX  # NEW modality (not in checkpoint)    
      # ============================================================
      # DEFINE NEW MODALITY
      # ============================================================
      # This tells LunarBackbone how to create embeddings for nac_custom
      # NOTE: Must use backbone_ prefix for TerraTorch to pass it correctly
      backbone_new_modalities:
        CUR:
          type: image              # Raw image modality
          num_channels: 1          # Single grayscale channel
          data_range: [-1.0, 1.0]   # Normalized pixel values
          patch_size: 16           # Match checkpoint configuration
          input_size: 256          # Match checkpoint configuration
          stats:
            CUR:
              gsd_m: 100.0
        DICE:
          type: image              # Raw image modality
          num_channels: 1          # Single grayscale channel
          data_range: [-1.0, 1.0]   # Normalized pixel values
          patch_size: 16           # Match checkpoint configuration
          input_size: 256          # Match checkpoint configuration
          stats:
            DICE:
              gsd_m: 100.0
        LPSR:
          type: image              # Raw image modality
          num_channels: 1          # Single grayscale channel
          data_range: [-1.0, 1.0]  # Normalized pixel values
          patch_size: 16           # Match checkpoint configuration
          input_size: 256          # Match checkpoint configuration
          stats:
            LPSR:
              gsd_m: 100.0
        LPSR_DEN:
          type: image              # Raw image modality
          num_channels: 1          # Single grayscale channel
          data_range: [-1.0, 1.0]   # Normalized pixel values
          patch_size: 16           # Match checkpoint configuration
          input_size: 256          # Match checkpoint configuration
          stats:
            LPSR_DEN:
              gsd_m: 100.0
        LPSR_DIS:
          type: image              # Raw image modality
          num_channels: 1          # Single grayscale channel
          data_range: [-1.0, 1.0]   # Normalized pixel values
          patch_size: 16           # Match checkpoint configuration
          input_size: 256          # Match checkpoint configuration
          stats:
            LPSR_DIS:
              gsd_m: 100.0
        TMAX:
          type: image              # Raw image modality
          num_channels: 1          # Single grayscale channel
          data_range: [-1.0, 1.0]   # Normalized pixel values
          patch_size: 16           # Match checkpoint configuration
          input_size: 256          # Match checkpoint configuration
          stats:
            TMAX:
              gsd_m: 100.0
      # Register tokens are auto-detected from checkpoint
      # This checkpoint has num_register_tokens=0, so no register tokens
      # If checkpoint had register tokens, they would be auto-detected
      # backbone_remove_register_tokens: true  # Remove register tokens before neck (if any)
      backbone_merge_method: concat     
      # Neck configuration for tiny model (12 encoder layers)
      necks:
        - name: SelectIndices
          indices: [2, 5, 8, 11]  # Select 4 layers from 12-layer encoder
        - name: LearnedTokenProjection
          output_dim: 768
        - name: ReshapeTokensToImage
          remove_cls_token: false
          h: 16  # sqrt(256) for 256x256 / 16x16 patches
          # h: 32 # sqrt(256) for 256x256 / 8x8 patches
        - name: LearnedInterpolateToPyramidal
      decoder: UNetDecoder
      decoder_channels: [512, 256, 128, 64]    
      # ============================================================
      # EMBEDDING PARAMETERS
      # ============================================================
      # Configure how embeddings are created for nac_custom
      # NOTE: Must use backbone_ prefix for TerraTorch to pass it correctly

    # Training configuration
    freeze_backbone: false  # Fine-tune encoder (or set to true to freeze)
    freeze_decoder: false   # Train detection head
    loss: rmse
    ignore_index: -1        
optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 1e-5

lr_scheduler:
  class_path: ReduceLROnPlateau
  init_args:
    factor: 0.5
    patience: 5
    monitor: train/loss

