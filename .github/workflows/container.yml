name: Build LFM container

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: lfm-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    # Override with an ARM64 runner label if more disk/RAM is needed.
    runs-on: ${{ vars.CONTAINER_RUNNER || 'ubuntu-24.04-arm' }}
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify native ARM64 runner
        shell: bash
        run: |
          test "$(uname -m)" = aarch64
          docker info
          df -h /

      - name: Free space on GitHub-hosted runner
        if: runner.environment == 'github-hosted'
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Prepare image tags
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          {
            echo 'tags<<EOF'
            echo "${image}:sha-${GITHUB_SHA}"
            if [[ "$GITHUB_REF" == "refs/heads/${DEFAULT_BRANCH}" ]]; then
              echo "${image}:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish ARM64 image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=lfm-arm64
          cache-to: type=gha,mode=min,scope=lfm-arm64,ignore-error=true

      - name: Record published image
        shell: bash
        env:
          IMAGE_TAGS: ${{ steps.image.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo 'Published ARM64 LFM container:'
            echo '```text'
            echo "$IMAGE_TAGS"
            echo "$IMAGE_DIGEST"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
