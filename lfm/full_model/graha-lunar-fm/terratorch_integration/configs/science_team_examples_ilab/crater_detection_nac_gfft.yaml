# Lunar Crater Detection (NAC only) — Fourier-VQ MultiMAE backbone
# Backbone: lunar_fvqmultimae (from origin/old-main), pretrained on
# vis/uv/dtm/slope/aspect at 256×256, patch_size=8.
# NAC is a new modality (was not in pretraining) → declared under
# backbone_new_modalities so its input adapter is randomly initialised
# and receives head_lr (not the tiny LLRD layer-0 LR).
#
# RUN:
#   bsub -q normal -n 10 -M 64G -gpu "num=1:mode=exclusive_process" \
#        -oo logs/%J.out -eo logs/%J.err \
#        PYTHONPATH=.:$PYTHONPATH \
#        terratorch fit -c terratorch_integration/configs/nac_craters/crater_detection_nac_only_fvqmultimae.yaml
seed_everything: 42
custom_modules_path: terratorch_integration

trainer:
  accelerator: auto
  devices: 1
  precision: "32"
  max_epochs: 100
  check_val_every_n_epoch: 1
  log_every_n_steps: 10
  enable_checkpointing: true
  logger:
    class_path: TensorBoardLogger
    init_args:
      save_dir: tb_logs/
      name: crater-detection-nac-gfft
  callbacks:
    - class_path: LearningRateMonitor
      init_args:
        logging_interval: epoch
    - class_path: ModelCheckpoint
      init_args:
        dirpath: tb_logs/checkpoints/crater-detection-nac-gfft
        monitor: val_map
        mode: max
        filename: best-{epoch:02d}-{val_map:.3f}
        save_last: true
    - class_path: EarlyStopping
      init_args:
        monitor: val_map
        mode: max
        patience: 15

data:
  class_path: terratorch_integration.data_adapter.LunarNACDTMDataModule
  init_args:
    data_dir: /explore/nobackup/projects/lfm/processed_data/Lunar/data_release/NAC_craters_coco_release_final
    metadata_file: /explore/nobackup/projects/lfm/processed_data/Lunar/data_release/NAC_craters_coco_release_final/metadata.parquet
    annotations_file: /explore/nobackup/projects/lfm/processed_data/Lunar/data_release/NAC_craters_coco_release_final/nac_handlabeled_annotations.json
    modalities: [nac]
    output_mode: packed
    batch_size: 4
    num_workers: 4
    image_size: 256
    min_diameter_m: 10.0
    drop_no_crater_images: true
    used_for_labeling_only: true
    nac_norm_mean: 0.02094413563125313
    nac_norm_std: 0.019197145587676916
    dtm_global_std: 44.24927615891305
    train_transforms:
      class_path: terratorch_integration.data_utils.D4DetectionTransform
      init_args:
        image_keys: [image]
        p: 1.0

model:
  class_path: terratorch_integration.LunarObjectDetectionTask
  init_args:
    model_factory: ObjectDetectionModelFactory
    model_args:
      framework: faster-rcnn
      backbone: lunar_fvqmultimae
      backbone_checkpoint_path: /explore/nobackup/projects/lfm/rohit/lunar_baselines/gfft_lunar/experiments/GFFT_lunar_wac_mm_fullres_repl_p8_gh200_npz/weights/epoch_511_loss_0.164.pth
      num_classes: 2
      framework_min_size: 256
      framework_max_size: 256

      # ---------------- Dense-scene training tuning (v3, uniform sweep) ----
      # Consumed by ObjectDetectionModelFactory at construction time. Do NOT
      # survive `terratorch test --ckpt_path` — use `eval_*` init args for
      # post-hoc eval overrides. RPN/ROI IoU thresholds and sample budgets
      # matched to the v3 lunarmind_v1_base run for cross-backbone fairness.
      framework_rpn_fg_iou_thresh: 0.5
      framework_rpn_bg_iou_thresh: 0.2
      framework_box_fg_iou_thresh: 0.5
      framework_box_bg_iou_thresh: 0.3
      framework_rpn_batch_size_per_image: 512
      framework_box_batch_size_per_image: 1024
      framework_box_positive_fraction: 0.5
      framework_box_detections_per_img: 600
      framework_box_nms_thresh: 0.5
      framework_rpn_post_nms_top_n_train: 3000
      framework_rpn_post_nms_top_n_test: 3000
      framework_rpn_pre_nms_top_n_train: 6000
      framework_rpn_pre_nms_top_n_test: 6000
      framework_box_detections_per_img: 600
      backbone_merge_method: concat
      backbone_modalities:
        - nac
      backbone_new_modalities:
        nac:
          num_channels: 1
          patch_size: 8
          image_size: 256
      backbone_patch_size: 8
      backbone_image_size: 256
      # Stochastic depth on the fvqMultiMAE encoder. Applied for symmetric
      # FM-vs-FM comparison (LunarFM dp01v2 uses drop_path 0.1 too). Kwarg
      # name is `drop_path_rate` here (not `_encoder`) — matches
      # FVQMultiMAEBackbone.__init__.
      backbone_drop_path_rate: 0.1
      in_channels: 1

      necks:
        - name: SelectIndices
          indices: [2, 5, 8, 11]
        - name: ReshapeTokensToImage
          remove_cls_token: false
          h: 32
        - name: MultilayerSimpleFeaturePyramid
          out_channels: 256
        - name: FeaturePyramidNetworkNeck

    freeze_backbone: false
    freeze_decoder: false

    class_names:
      - Background
      - Crater

    # -------------------- Fair-reporting metric config --------------------
    # score_threshold: pre-metric filter in apply_nms_batch. Default 0.5
    # discards the true-positive tail on dense-detection tasks; drop to 0.05
    # so the mAP curve sees the low-confidence detections it is designed for.
    # iou_threshold: NMS IoU (default 0.5). Kept explicit for symmetry across
    # NAC/WAC/LRO — bump toward 0.7 if you see many overlapping duplicates.
    # metric_kwargs: forwarded to torchmetrics MeanAveragePrecision so we can
    # lift the default max_detection_thresholds=[1, 10, 100] ceiling on dense
    # GT (≈200–330 boxes / tile) and get per-class AP. Same list across NAC
    # and WAC keeps the datasets scored on the same ruler.
    score_threshold: 0.05
    # Second-pass NMS at 0.3 matches eval_box_nms_thresh below. Uniform
    # inference ruler across nac_craters configs so backbones are compared
    # under identical post-processing. Empirically +2 pp val_map_50 vs 0.5
    # on the FM checkpoint — duplicate boxes on real craters were counted
    # as FPs; tighter NMS collapses them.
    iou_threshold: 0.3
    metric_kwargs:
      max_detection_thresholds: [100, 300, 500]
      class_metrics: true

    # ---- Eval-time FasterRCNN caps (uniform across nac_craters configs) ----
    eval_box_detections_per_img: 600
    eval_box_nms_thresh: 0.3
    eval_rpn_post_nms_top_n_test: 3000

    # v3 anchor ladder — multi-size per FPN level catches the small crater
    # tail and preserves large coverage with [48, 96] at the top.
    anchor_sizes: [[4, 6], [8, 12], [16, 24], [48, 96]]
    anchor_aspect_ratios: [0.7, 1.0, 1.4]

    # dp01v2 (fvqMultiMAE): same recipe as LunarFM dp01v2 for symmetric FM
    # comparison.
    #   head_lr: 1e-4 → 5e-5
    #   head_weight_decay: 1e-4 → 1e-3
    #   layer_decay: 0.75 → 0.65
    backbone_lr: 5.0e-5
    head_lr: 5.0e-5
    layer_decay: 0.65
    weight_decay: 0.05
    head_weight_decay: 1.0e-3
    betas: [0.9, 0.999]
    warmup_steps: 500
    eta_min: 1.0e-6
