# Lunar Crater Detection — NAC + split param groups
# See notes at the bottom for what changed vs. the base config.
#
# RUN:
#   PYTHONPATH=. \
#   terratorch fit --config terratorch_integration/configs/crater_detection_nac_graha.yaml

seed_everything: 42
custom_modules_path: terratorch_integration

trainer:
  accelerator: cpu
  devices: 1
  precision: "32"
  max_epochs: 100
  check_val_every_n_epoch: 1
  log_every_n_steps: 5
  # RPN loss can spike sharply on small batches (bs=4) with fresh heads.
  # Global-norm clip at 1.0 is standard for ViTDet / MMDet detectors and
  # keeps the head from taking a single bad step that ruins the val curve.
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  logger:
    class_path: TensorBoardLogger
    init_args:
      save_dir: tb_logs/
      name: crater-detection-nac-graha
  callbacks:
    - class_path: LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: ModelCheckpoint
      init_args:
        dirpath: tb_logs/checkpoints/crater-detection-nac-graha
        monitor: val_map
        mode: max
        filename: best-{epoch:02d}-{val_map:.3f}
        save_top_k: 3
        save_last: true

data:
  class_path: terratorch_integration.data_adapter.LunarNACDTMDataModule
  init_args:
    data_dir: /nobackupnfs1/sroy14/processed_data/Lunar/data_release/NAC_craters_coco_release
    metadata_file: /nobackupnfs1/sroy14/processed_data/Lunar/data_release/NAC_craters_coco_release/metadata.parquet
    annotations_file: /nobackupnfs1/sroy14/processed_data/Lunar/data_release/NAC_craters_coco_release/splits_used_for_labeling/nac_handlabeled_annotations.json
    modalities: [nac]

    metadata_tokenizer_path: terramind/utils/tokenizer/trained/text_tokenizer_terramind_wordpiece_30k_binned_xyxy_reindexed.json
    metadata_binning_config_path: terramind/utils/tokenizer/trained/metadata_binning_config.csv
    output_mode: packed
    batch_size: 4
    num_workers: 0
    image_size: 256
    min_diameter_m: 5.0
    nac_mask_threshold: -1.0
    nac_mask_fill_value: 0.0
    nac_norm_mean: 0.451789
    nac_norm_std: 0.169636
    dtm_mask_threshold: -9999.0
    dtm_mask_fill_value: 0.0
    dtm_global_std: 15.533791

model:
  class_path: terratorch_integration.LunarObjectDetectionTask
  init_args:
    model_factory: ObjectDetectionModelFactory
    model_args:
      framework: faster-rcnn
      backbone: lunarmind_v1_base
      backbone_checkpoint_path: /nobackupnfs1/sroy14/gabby/Lunar-FM/experiments/lunarfm_base_dual_full_nas_no_nans_256_256_lr1e-4_wd0.05/checkpoints/checkpoint_weights_final.pt
      backbone_cfg: /nobackupnfs1/sroy14/gabby/Lunar-FM/experiments/lunarfm_base_dual_full_nas_no_nans_256_256_lr1e-4_wd0.05/full_config.yaml
      backbone_modality_info_path: /nobackupnfs1/sroy14/gabby/Lunar-FM/experiments/lunarfm_base_dual_full_nas_no_nans_256_256_lr1e-4_wd0.05/modality_info.yaml
      num_classes: 2
      framework_min_size: 256
      framework_max_size: 256

      backbone_modalities:
        - nac
        # - dtm_3m
        # - metadata

      backbone_patch_size: 8
      backbone_remove_register_tokens: false
      backbone_merge_method: concat

      in_channels: 1
      necks:
        - name: SelectIndices
          indices: [2, 5, 8, 11]
        # - name: LearnedTokenProjection
        #   output_dim: 768
        - name: ReshapeTokensToImage
          remove_cls_token: false
          h: 32
        - name: LearnedInterpolateToPyramidal
        - name: FeaturePyramidNetworkNeck

    freeze_backbone: false
    freeze_decoder: false

    class_names:
      - Background
      - Crater

    # -------------------- LLRD + split-group optimizer --------------------
    # Base LR at the TOP of the backbone (encoder_norm). Deeper blocks get
    # backbone_lr * layer_decay ** (depth_from_top). With 12 blocks and
    # layer_decay=0.75, block 0 sees ~0.75^12 ≈ 0.032× → ~1.6e-6.
    #
    # Previous run peaked at ~0.115 val_map at ~2k steps then collapsed — the
    # heads were being trained too aggressively for bs=4. Tuned down here:
    #   - head_lr 2e-4 → 1e-4
    #   - betas (0.9, 0.98) → (0.9, 0.999)  (standard for detection, not LM)
    #   - head_weight_decay 0.05 → 1e-4  (large WD hurts small-data detectors)
    #   - warmup_steps 500 → 1500  (heads need more time to settle)
    # Also enabled trainer.gradient_clip_val = 1.0 to catch RPN spikes.
    anchor_sizes: [[8], [16], [32], [64]]
    anchor_aspect_ratios: [0.5, 1.0, 2.0]
    backbone_lr: 5.0e-5
    head_lr: 1.0e-4
    layer_decay: 0.75
    weight_decay: 0.05           # backbone weight decay (ViT default)
    head_weight_decay: 1.0e-4    # RPN / ROI heads: much lower
    betas: [0.9, 0.999]

    warmup_steps: 1500
    # cosine_t_max: null → auto = trainer.estimated_stepping_batches - warmup_steps
    eta_min: 1.0e-6

# NOTE: intentionally NO top-level optimizer / lr_scheduler blocks.
# Lightning CLI monkey-patches configure_optimizers when they're present,
# which would silently discard the LLRD param groups defined by the task.

# ------------------------------ Why LLRD ------------------------------
# Pretrained ViT + fresh detector heads have very different LR needs:
#   - Encoder wants a small LR to preserve pretrained features.
#   - RPN, ROI-heads, and neck projections are randomly init'd and want more.
#   - Within the encoder, top blocks are more task-specific (need more LR),
#     bottom blocks are generic (need less). layer_decay=0.75 is the ViTDet
#     default; try 0.65 if the FM still overfits, 0.85 if it underfits.
#
# WD is disabled for biases, LayerNorm weights, pos embeddings, register
# tokens, and mod_emb — standard ViT practice.
