# Lunar Crater Detection — NAC only
# Backbone: lunarmind_v1_base from 100k pretraining (matrix_base_vit_4g_8w_128b_1r_250s_6pf)
#
# RUN:
#   PYTHONPATH=/u/fraccaro/Projects/Lunar-FM:$PYTHONPATH \
#   terratorch fit --config terratorch_integration/configs/crater_detection_nac_only.yaml
##   PYTHONPATH=. \
#   terratorch fit --config terratorch_integration/configs/crater_detection_nac_only.yaml
# Checkpoint facts (derived from weights):
#   embed_dim=768, encoder_depth=12, patch_size=16 (nac.pos_emb=(1,256,768)),
#   num_register_tokens=0
seed_everything: 42
custom_modules_path: terratorch_integration

trainer:
  accelerator: gpu
  devices: 1
  precision: "32"
  max_epochs: 100
  check_val_every_n_epoch: 1
  log_every_n_steps: 5
  logger:
    class_path: TensorBoardLogger
    init_args:
      save_dir: tb_logs/
      name: crater-detection-nac-only-resnet
  callbacks:
    - class_path: LearningRateMonitor
      init_args:
        logging_interval: epoch
    - class_path: ModelCheckpoint
      init_args:
        dirpath: tb_logs/checkpoints/crater-detection-nac-only
        monitor: val_map
        mode: max
        filename: best-{epoch:02d}-{val_map:.3f}
        save_top_k: 3
        save_last: true

data:
  class_path: terratorch_integration.data_adapter.LunarNACDTMDataModule
  init_args:
    data_dir: data/NAC_handlabeled_1m_256
    metadata_file: data/NAC_handlabeled_1m_256/metadata.parquet
    annotations_file: data/NAC_handlabeled_1m_256/nac_nac_handlabeled_annotations.json
    modalities: [nac]

    output_mode: packed
    batch_size: 4
    num_workers: 0
    image_size: 256
    min_diameter_m: 5.0
    # NAC normalisation (see multimodal config for provenance)
    nac_mask_threshold: -1.0
    nac_mask_fill_value: 0.0
    nac_norm_mean: 0.451789
    nac_norm_std: 0.169636

model:
  class_path: terratorch_integration.LunarObjectDetectionTask
  init_args:
    model_factory: ObjectDetectionModelFactory
    model_args:
      framework: faster-rcnn

      # timm's ResNet50 via terratorch's TIMM backbone source. features_only=True
      # is applied automatically by TimmRegistry. out_indices=(1,2,3,4) selects
      # the four ResNet stages at strides 4, 8, 16, 32 — matching the four
      # anchor levels below. Excluding stage 0 (stride 2) keeps the neck at
      # 4 levels, same count the FM run has after LearnedInterpolateToPyramidal.
      backbone: timm_resnet50
      backbone_pretrained: true
      backbone_in_chans: 1                    # NAC; timm averages pretrained conv1 weights
      backbone_out_indices: [1, 2, 3, 4]

      num_classes: 2
      framework_min_size: 256
      framework_max_size: 256

      in_channels: 2                          # tells the factory the packed tensor is 2-channel
      necks:
        # timm ResNet50 with features_only already returns a list of multi-scale
        # feature maps at 4 levels — just run them through the FPN. No token
        # reshaping, no interpolation to pyramidal (unlike the ViT which needs
        # both because it produces a single-scale sequence of tokens).
        - name: FeaturePyramidNetworkNeck

    freeze_backbone: false
    freeze_decoder: false

    class_names:
      - Background
      - Crater


optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 1.0e-4
    weight_decay: 0.05
    betas: [0.9, 0.98]

lr_scheduler:
  class_path: CosineAnnealingLR
  init_args:
    T_max: 100
    eta_min: 1.0e-6
