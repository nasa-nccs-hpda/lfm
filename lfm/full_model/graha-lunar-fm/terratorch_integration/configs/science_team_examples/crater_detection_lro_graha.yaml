# Lunar Crater Detection — LRO grayscale JPGs fed to the WAC-pretrained backbone
# Framework: Mask R-CNN (matches the published LRO_Craters baseline).
#
# Same as crater_detection_lro_vis.yaml but with:
#   * data.load_masks=true — rasterizes each annotation's COCO polygon into
#     a per-instance binary mask (LRO_Craters ships 72-vertex polygons per
#     crater).  Backward-compat: set to false for Faster R-CNN.
#   * model.framework=mask-rcnn — adds torchvision's mask head to the
#     shared Faster-R-CNN stack.  The extra mask loss regularises the
#     backbone features and typically improves mAP50 on small objects.
#
# The RPN, FPN, and anchor mechanism are identical to Faster R-CNN, so
# most of the config is copied verbatim from crater_detection_lro_vis.yaml.
#
# RUN:
#   PYTHONPATH=/u/fraccaro/Projects/Lunar-FM:$PYTHONPATH \
#   terratorch fit --config terratorch_integration/configs/crater_detection_lro_vis_maskrcnn.yaml
seed_everything: 42
custom_modules_path: terratorch_integration

trainer:
  accelerator: auto
  devices: 1
  precision: "32"
  max_epochs: 50
  check_val_every_n_epoch: 1
  log_every_n_steps: 10
  enable_checkpointing: true
  logger:
    class_path: TensorBoardLogger
    init_args:
      save_dir: tb_logs/
      name: crater-detection-lro-graha
  callbacks:
    - class_path: LearningRateMonitor
      init_args:
        logging_interval: epoch
    - class_path: ModelCheckpoint
      init_args:
        dirpath: tb_logs/checkpoints/crater-detection-lro-graha
        monitor: val_bbox_map
        mode: max
        filename: best-{epoch:02d}-{val_bbox_map:.3f}
        save_last: true
    - class_path: EarlyStopping
      init_args:
        monitor: val_bbox_map
        mode: max
        patience: 15

data:
  class_path: terratorch_integration.data_adapter.LunarCraterDataModule
  init_args:
    root: /nobackupnfs1/sroy14/lunar-finetuning/LRO_craters
    batch_size: 4
    num_workers: 4
    image_size: 512
    output_mode: vis
    replicate_bands: 5
    norm_mean: 0.251561
    norm_std: 0.121082
    load_masks: true             # rasterize COCO polygons into per-instance masks
    train_transforms:
      class_path: terratorch_integration.data_utils.D4DetectionTransform
      init_args:
        image_keys: [image, vis]
        p: 1.0

model:
  class_path: terratorch_integration.LunarObjectDetectionTask
  init_args:
    model_factory: ObjectDetectionModelFactory
    model_args:
      framework: mask-rcnn       # <-- adds the mask head
      backbone: lunarmind_v1_base
      backbone_checkpoint_path: /nobackupnfs1/sroy14/gabby/Lunar-FM/experiments/lunarfm_base_dual_full_nas_no_nans_256_256_lr1e-4_wd0.05/checkpoints/checkpoint_weights_final.pt
      backbone_cfg: /nobackupnfs1/sroy14/gabby/Lunar-FM/experiments/lunarfm_base_dual_full_nas_no_nans_256_256_lr1e-4_wd0.05/full_config.yaml
      backbone_modality_info_path: /nobackupnfs1/sroy14/gabby/Lunar-FM/experiments/lunarfm_base_dual_full_nas_no_nans_256_256_lr1e-4_wd0.05/modality_info.yaml

      num_classes: 2             # background + crater
      framework_min_size: 512
      framework_max_size: 512

      backbone_modalities:
        - vis                    # (B, 5, 512, 512) — grayscale replicated to 5 bands

      backbone_patch_size: 8
      backbone_remove_register_tokens: false
      backbone_merge_method: concat

      in_channels: 5
      necks:
        - name: SelectIndices
          indices: [2, 5, 8, 11]
        - name: ReshapeTokensToImage
          remove_cls_token: false
          h: 64
        - name: LearnedInterpolateToPyramidal
        - name: FeaturePyramidNetworkNeck

    freeze_backbone: false
    freeze_decoder: false

    class_names:
      - Background
      - Crater

    anchor_sizes: [[8], [16], [32], [64]]
    anchor_aspect_ratios: [0.5, 1.0, 2.0]

    backbone_lr: 5.0e-5
    head_lr: 1.0e-4
    layer_decay: 0.75
    weight_decay: 0.05
    head_weight_decay: 1.0e-4
    betas: [0.9, 0.999]
    warmup_steps: 500
    eta_min: 1.0e-6

# NOTE: intentionally NO top-level optimizer / lr_scheduler blocks.
# Lightning CLI monkey-patches configure_optimizers when present, which
# would silently discard the LLRD param groups defined by the task.
