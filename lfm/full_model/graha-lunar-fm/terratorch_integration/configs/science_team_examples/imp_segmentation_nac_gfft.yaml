# Lunar IMP Semantic Segmentation — Fourier-VQ MultiMAE backbone.
# Backbone: lunar_fvqmultimae (from origin/old-main), pretrained on
# vis/uv/dtm/slope/aspect at 256×256, patch_size=8.
# NAC is a new modality → declared under backbone_new_modalities.
#
# RUN:
#   bsub -q normal -n 10 -M 64G -gpu "num=1:mode=exclusive_process" \
#        -oo logs/%J.out -eo logs/%J.err \
#        PYTHONPATH=. \
#        terratorch fit -c terratorch_integration/configs/imp/imp_segmentation_nac_fvqmultimae.yaml
seed_everything: 42
custom_modules_path: terratorch_integration

trainer:
  accelerator: auto
  devices: 1
  precision: "32"
  max_epochs: 100
  check_val_every_n_epoch: 1
  log_every_n_steps: 5
  logger:
    class_path: TensorBoardLogger
    init_args:
      save_dir: tb_logs/
      name: imp-segmentation-nac-gfft
  callbacks:
    - class_path: LearningRateMonitor
      init_args:
        logging_interval: epoch
    - class_path: ModelCheckpoint
      init_args:
        dirpath: tb_logs/checkpoints/imp-segmentation-nac-gfft
        monitor: val/loss
        mode: min
        filename: best-{epoch:02d}-{val/loss:.3f}
        save_top_k: 1
        save_last: false

data:
  class_path: terratorch.datamodules.GenericNonGeoSegmentationDataModule
  init_args:
    batch_size: 16
    num_workers: 1
    rgb_indices: [0, 0, 0]
    train_data_root: /nobackupnfs1/sroy14/processed_data/Lunar/data_release/IMP_dataset_mike/train
    train_label_data_root: /nobackupnfs1/sroy14/processed_data/Lunar/data_release/IMP_dataset_mike/train
    val_data_root: /nobackupnfs1/sroy14/processed_data/Lunar/data_release/IMP_dataset_mike/val
    val_label_data_root: /nobackupnfs1/sroy14/processed_data/Lunar/data_release/IMP_dataset_mike/val
    test_data_root: /nobackupnfs1/sroy14/processed_data/Lunar/data_release/IMP_dataset_mike/test
    test_label_data_root: /nobackupnfs1/sroy14/processed_data/Lunar/data_release/IMP_dataset_mike/test
    predict_data_root:  /nobackupnfs1/sroy14/processed_data/Lunar/data_release/IMP_dataset_mike/test
    train_split: /nobackupnfs1/sroy14/processed_data/Lunar/data_release/IMP_dataset_mike/train.txt
    val_split: /nobackupnfs1/sroy14/processed_data/Lunar/data_release/IMP_dataset_mike/val.txt
    test_split: /nobackupnfs1/sroy14/processed_data/Lunar/data_release/IMP_dataset_mike/test.txt
    num_classes: 2
    ignore_split_file_extensions: false
    img_grep: "*_img.tif"
    label_grep: "*_mask.tif"
    no_label_replace: -1
    no_data_replace: 0
    means:
      - 0.030510
    stds:
      - 0.017363
    train_transform:
      - class_path: albumentations.D4
      - class_path: albumentations.RandomBrightnessContrast
        init_args:
          brightness_limit: 0.15
          contrast_limit: 0.15
          p: 0.5
      - class_path: albumentations.pytorch.transforms.ToTensorV2

model:
  class_path: terratorch_integration.LunarSegmentationTask
  init_args:
    backbone_lr: 1.0e-5
    head_lr: 2.0e-4
    layer_decay: 0.85
    weight_decay: 0.05
    warmup_steps: 200
    eta_min: 1.0e-6
    model_factory: EncoderDecoderFactory
    model_args:
      backbone: lunar_fvqmultimae
      backbone_checkpoint_path: /nobackupnfs1/sroy14/rohit/lunar_baselines/gfft_lunar/experiments/GFFT_lunar_wac_mm_fullres_repl_p8_gh200_npz/weights/epoch_511_loss_0.164.pth
      backbone_modalities:
        - nac
      backbone_new_modalities:
        nac:
          num_channels: 1
          patch_size: 8
          image_size: 256
      backbone_patch_size: 8
      backbone_image_size: 256
      necks:
        - name: SelectIndices
          indices: [2, 5, 8, 11]
        - name: ReshapeTokensToImage
          remove_cls_token: false
          h: 32
        - name: LearnedInterpolateToPyramidal
      decoder: UNetDecoder
      decoder_channels: [512, 256, 128, 64]
      head_channel_list: [256]
      head_dropout: 0.1
      num_classes: 2
    loss:
      dice: 1.0
      ce: 0.25
      lovasz: 0.5
    class_weights: [0.1, 0.9]
    aux_loss:
      aux_head: 1.0
    freeze_backbone: false
    freeze_decoder: false
    ignore_index: -1
    plot_on_val: 10
