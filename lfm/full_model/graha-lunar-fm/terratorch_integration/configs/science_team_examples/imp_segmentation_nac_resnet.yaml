# Lunar IMP Semantic Segmentation — NAC only, ResNet50 ImageNet baseline
#
# Purpose: strongest defensible CNN baseline against the FM IMP run. Same
# data, same UNet decoder, same head. Backbone is ImageNet-pretrained
# ResNet50 (timm) with conv1 adapted from 3 → 1 channels via adapt_input_conv.
#
# Recipe: flat AdamW at 1e-4, weight_decay 1e-4 (CNN-standard). No LLRD —
# that's a ViT technique and applying it here would look like unfair baseline
# tuning.
#
# RUN (from repo root):
#   PYTHONPATH=. \
#   terratorch fit --config terratorch_integration/configs/imp_segmentation_nac_resnet.yaml

seed_everything: 42
custom_modules_path: terratorch_integration

trainer:
  accelerator: auto
  devices: 1
  precision: "32"
  max_epochs: 100
  check_val_every_n_epoch: 1
  log_every_n_steps: 5
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  logger:
    class_path: TensorBoardLogger
    init_args:
      save_dir: tb_logs/
      name: imp-segmentation-nac-resnet
  callbacks:
    - class_path: LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: ModelCheckpoint
      init_args:
        dirpath: tb_logs/checkpoints/imp-segmentation-nac-resnet
        monitor: val/loss
        mode: min
        filename: best-{epoch:02d}-{val/loss:.3f}
        save_top_k: 1
        save_last: false

data:
  class_path: terratorch.datamodules.GenericNonGeoSegmentationDataModule
  init_args:
    batch_size: 16
    num_workers: 1
    rgb_indices:
      - 0
      - 0
      - 0
    train_data_root: /nobackupnfs1/sroy14/processed_data/Lunar/data_release/IMP_dataset_mike/train
    train_label_data_root: /nobackupnfs1/sroy14/processed_data/Lunar/data_release/IMP_dataset_mike/train
    val_data_root: /nobackupnfs1/sroy14/processed_data/Lunar/data_release/IMP_dataset_mike/val
    val_label_data_root: /nobackupnfs1/sroy14/processed_data/Lunar/data_release/IMP_dataset_mike/val
    test_data_root: /nobackupnfs1/sroy14/processed_data/Lunar/data_release/IMP_dataset_mike/test
    test_label_data_root: /nobackupnfs1/sroy14/processed_data/Lunar/data_release/IMP_dataset_mike/test
    predict_data_root:  /nobackupnfs1/sroy14/processed_data/Lunar/data_release/IMP_dataset_mike/test
    train_split: /nobackupnfs1/sroy14/processed_data/Lunar/data_release/IMP_dataset_mike/train.txt
    val_split: /nobackupnfs1/sroy14/processed_data/Lunar/data_release/IMP_dataset_mike/val.txt
    test_split: /nobackupnfs1/sroy14/processed_data/Lunar/data_release/IMP_dataset_mike/test.txt
    num_classes: 2
    ignore_split_file_extensions: false
    img_grep: "*_img.tif"
    label_grep: "*_mask.tif"
    no_label_replace: -1
    no_data_replace: 0
    means:
      - 0.030510
    stds:
      - 0.017363
    train_transform:
      - class_path: albumentations.D4
      - class_path: albumentations.RandomBrightnessContrast
        init_args:
          brightness_limit: 0.15
          contrast_limit: 0.15
          p: 0.5
      - class_path: albumentations.pytorch.transforms.ToTensorV2

model:
  # LunarSegmentationTask with layer_decay=1.0 == flat AdamW. Using the
  # custom task keeps the config knobs identical to the FM run so anyone
  # reading the two configs can see the recipe is matched.
  class_path: terratorch_integration.LunarSegmentationTask
  init_args:
    # Flat CNN recipe — matches crater-detection ResNet baseline.
    backbone_lr: 1.0e-4
    head_lr: 1.0e-4
    layer_decay: 1.0
    weight_decay: 1.0e-4
    head_weight_decay: 1.0e-4
    betas: [0.9, 0.999]
    warmup_steps: 500
    eta_min: 1.0e-6

    model_factory: EncoderDecoderFactory
    model_args:
      # timm ResNet50 via terratorch's TIMM registry. features_only=True is
      # applied automatically. Return all 5 stages (strides 2/4/8/16/32);
      # the neck's SelectIndices picks which 4 the UNetDecoder consumes,
      # mirroring the FM config's "layer selection lives in the neck" style.
      backbone: timm_resnet50
      backbone_pretrained: true
      backbone_in_chans: 1
      backbone_out_indices: [0, 1, 2, 3, 4]

      necks:
        # Pick the 4 stages at strides 4/8/16/32 (skip stage 0 at stride 2).
        # ResNet features_only already returns multi-scale maps — no reshape
        # or interpolation needed (unlike the ViT).
        - name: SelectIndices
          indices: [1, 2, 3, 4]

      decoder: UNetDecoder
      decoder_channels: [512, 256, 128, 64]
      head_channel_list: [256]
      head_dropout: 0.1
      num_classes: 2

    loss: dice
    aux_loss:
      aux_head: 1.0
    freeze_backbone: false
    freeze_decoder: false
    ignore_index: -1
    plot_on_val: 10
