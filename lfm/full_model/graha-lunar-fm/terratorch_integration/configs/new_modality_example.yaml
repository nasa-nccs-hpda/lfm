# Lunar Crater Detection with TerraTorch Integration
# lightning.pytorch==2.1.1
#
# RUN with PYTHONPATH:
# PYTHONPATH=<path to Lunar-FM>:$PYTHONPATH terratorch fit --config terratorch_integration/configs/new_modality_example.yaml
#
seed_everything: 42
custom_modules_path: terratorch_integration

trainer:
  accelerator: gpu
  devices: 1
  precision: "32"
  max_epochs: 100
  check_val_every_n_epoch: 5
  log_every_n_steps: 10
  logger:
    class_path: TensorBoardLogger
    init_args:
      save_dir: tb_logs/
      name: lunar-crater-detection-custom
  callbacks:
    - class_path: LearningRateMonitor
      init_args:
        logging_interval: epoch
    - class_path: ModelCheckpoint
      init_args:
        dirpath: tb_logs/checkpoints/crater_detection_nac_custom
        monitor: val_map
        mode: max
        filename: best-{epoch:02d}-{val_map:.3f}
        save_top_k: 3
        save_last: true

data:
  class_path: terratorch_integration.data_adapter.LunarCraterDataModule
  init_args:
    root: data/LRO_craters
    batch_size: 4
    num_workers: 0  # Set to 0 to avoid multiprocessing pickle issues
    image_size: 256  # Match pretraining image size
    apply_norm_in_datamodule: true
    norm_means: [0.5]  # Grayscale normalization
    norm_stds: [0.25]

model:
  class_path: terratorch.tasks.ObjectDetectionTask
  init_args:
    model_factory: ObjectDetectionModelFactory
    model_args:
      framework: faster-rcnn
      backbone: lunarmind_v1_tiny
      backbone_checkpoint_path: weights/backbone/checkpoint_weights_final.pt
      backbone_cfg: weights/backbone/full_config.yaml
      num_classes: 2  # background + crater
      framework_min_size: 256
      framework_max_size: 256
      
      # ============================================================
      # NEW MODALITY: nac_custom (not in original checkpoint)
      # ============================================================
      # The checkpoint was trained on vis, dtm, slope, aspect, etc.
      # but NOT on nac_custom. We're adding it here dynamically.
      backbone_modalities:
        - nac_custom  # NEW modality (not in checkpoint)
      
      # ============================================================
      # DEFINE NEW MODALITY
      # ============================================================
      # This tells LunarBackbone how to create embeddings for nac_custom
      # NOTE: Must use backbone_ prefix for TerraTorch to pass it correctly
      backbone_new_modalities:
        nac_custom:
          type: image              # Raw image modality
          num_channels: 1          # Single grayscale channel
          data_range: [0.0, 1.0]   # Normalized pixel values
          patch_size: 16           # Match checkpoint configuration
          input_size: 256          # Match checkpoint configuration

      backbone_remove_register_tokens: true  # Remove register tokens before neck (if any)
      
      in_channels: 1  # Grayscale input
      
      # Neck configuration for tiny model (12 encoder layers)
      necks:
        - name: SelectIndices
          indices: [2, 5, 8, 11]  # Select 4 layers from 12-layer encoder
        - name: ReshapeTokensToImage
          remove_cls_token: false
          h: 16  # sqrt(256) for 256x256 / 16x16 patches
        - name: LearnedInterpolateToPyramidal
        - name: FeaturePyramidNetworkNeck
    
    # Training configuration
    freeze_backbone: false  # Fine-tune the entire backbone
    freeze_decoder: false   # Train detection head
    
    # Class names for crater detection
    class_names:
      - Background
      - Crater

optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 1e-4
    weight_decay: 0.05
    betas: [0.9, 0.98]  # Matching checkpoint optimizer config

lr_scheduler:
  class_path: CosineAnnealingLR
  init_args:
    T_max: 100
    eta_min: 1e-6


# Additional notes:
# New Modality Registration:
#    - nac_custom is NOT in the checkpoint's modalities
#    - LunarBackbone creates it using the "image" type template
#    - Merges with parameters from new_modalities config
